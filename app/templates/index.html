<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Прайс-листы CRM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bitrix JS SDK (в бою внутри виджета) -->
  <script src="//api.bitrix24.com/api/v1/"></script>

  <style>
    :root {
      --bx-blue: #3bc8f5;
      --bx-blue-dark: #0bb1e5;
      --bx-green: #bbed21;
      --bx-green-dark: #9ad215;
      --bx-border: #dce0e4;
      --bx-bg: #f5f7f9;
      --bx-text: #333;
      --bx-muted: #888;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: var(--bx-bg);
      color: var(--bx-text);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(9, 16, 29, 0.45);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.visible {
      display: flex;
    }

    .modal-dialog {
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.25);
      min-width: 960px;
      max-width: 1100px;
      max-height: 90vh;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--bx-border);
    }

    .modal-header {
      padding: 10px 14px;
      border-bottom: 1px solid #e1e6ec;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: move;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
    }

    .modal-close-btn {
      border: none;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      color: #999;
    }

    .modal-close-btn:hover {
      color: #555;
    }

    .modal-body {
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 12px;
      overflow: hidden;
    }

    .modal-footer {
      padding: 10px 14px;
      border-top: 1px solid #e1e6ec;
      display: flex;
      justify-content: flex-end;
      gap: 8px;
    }

    .price-list-sidebar {
      border: 1px solid #e3e7ee;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fafbfe;
    }

    .price-list-sidebar-header {
      padding: 8px 10px;
      background: #f4f7fb;
      border-bottom: 1px solid #e3e7ee;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .price-list-search {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid #c5ced8;
      background: #fff;
    }

    .price-list-search:focus {
      border-color: var(--bx-blue-dark);
      box-shadow: 0 0 0 2px rgba(59, 200, 245, 0.2);
    }

    .price-list-sidebar-list {
      flex: 1;
      overflow: auto;
      padding: 4px 0;
    }

    .price-list-item {
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price-list-item-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .price-list-item-count {
      margin-left: 8px;
      font-size: 11px;
      color: var(--bx-muted);
      white-space: nowrap;
    }

    .price-list-item:hover {
      background: #f0f6ff;
    }

    .price-list-item.active {
      background: #e2f3ff;
    }

    .price-list-form {
      border: 1px solid #e3e7ee;
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafbfe;
    }

    .price-list-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
    }

    .price-list-form-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .price-list-form-row label {
      font-size: 12px;
      color: #666;
    }

    .price-list-form-row input[type="text"],
    .price-list-form-row textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #c5ced8;
      background: #fff;
      outline: none;
      resize: vertical;
      min-height: 32px;
    }

    .price-list-form-row textarea {
      min-height: 60px;
    }

    .price-list-form-row input:focus,
    .price-list-form-row textarea:focus {
      border-color: var(--bx-blue-dark);
      box-shadow: 0 0 0 2px rgba(59, 200, 245, 0.2);
    }

    .price-list-form-meta {
      font-size: 12px;
      color: var(--bx-muted);
    }

    .price-items-wrapper {
      border: 1px solid #e3e7ee;
      border-radius: 6px;
      background: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      max-height: 260px;
    }

    .price-items-header {
      padding: 6px 8px;
      background: #f4f7fb;
      border-bottom: 1px solid #e3e7ee;
      font-size: 12px;
      font-weight: 600;
    }

    .price-items-table-container {
      overflow: auto;
    }

    .price-items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .price-items-table th,
    .price-items-table td {
      padding: 4px 6px;
      border-bottom: 1px solid #eef1f4;
      text-align: left;
      vertical-align: middle;
    }

    .price-items-table tbody tr:nth-child(even) {
      background: #fbfcfe;
    }

    .price-item-price-input {
      width: 100%;
      box-sizing: border-box;
      padding: 3px 4px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid #c5ced8;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: #2fba4a;
      color: #fff;
      padding: 8px 12px;
      border-radius: 4px;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.18);
      z-index: 11000;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }
    
    .app-root {
      max-width: 1360px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      border: 1px solid var(--bx-border);
      box-shadow: 0 1px 3px rgba(15, 35, 52, 0.08);
      padding: 16px;
      display: grid;
      grid-template-columns: minmax(0, 3fr) 260px;
      gap: 16px;
    }

    .left-block { min-width: 0; }
    .right-block { min-width: 0; }

    .toolbar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .toolbar-top-left,
    .toolbar-top-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--bx-border);
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: background 0.15s, box-shadow 0.15s, transform 0.05s;
    }

    .btn:hover:not(:disabled) { background: #f3f6fb; }
    .btn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.12);
    }

    .btn-primary {
      background: var(--bx-blue);
      border-color: var(--bx-blue-dark);
      color: #fff;
    }
    .btn-primary:hover:not(:disabled) { background: var(--bx-blue-dark); }

    .btn-danger {
      background: #ff726c;
      border-color: #ff5b54;
      color: #fff;
    }
    .btn-danger:hover:not(:disabled) { background: #ff5b54; }

    .btn-success {
      background: var(--bx-green);
      border-color: var(--bx-green-dark);
      color: #000;
      font-weight: 600;
    }
    .btn-success:hover:not(:disabled) { background: var(--bx-green-dark); }

    .btn:disabled { opacity: 0.5; cursor: default; }

    .tag {
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef2f5;
      font-size: 11px;
      color: var(--bx-muted);
    }

    .products-table-wrapper {
      border: 1px solid var(--bx-border);
      border-radius: 6px;
      overflow: hidden;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    thead { background: #f4f7fb; }

    th, td {
      padding: 6px 8px;
      border-bottom: 1px solid #eef1f4;
      text-align: left;
      white-space: nowrap;
      vertical-align: middle;
    }

    th { font-weight: 600; color: #555; }

    tbody tr:nth-child(even) { background: #fbfcfe; }
    tbody tr.selected { background: #e6f4ff; }

    .col-index { width: 26px; text-align: right; color: var(--bx-muted); }
    .col-checkbox { width: 26px; text-align: center; }
    .col-product { min-width: 280px; }
    .col-price-list { width: 140px; }
    .col-price { width: 120px; }
    .col-qty,
    .col-discount,
    .col-vat,
    .col-total { width: 90px; }

    input[type="checkbox"] {
      transform: scale(1.1);
      cursor: pointer;
    }

    select,
    input[type="number"],
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #c5ced8;
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    select:focus,
    input[type="number"]:focus,
    input[type="text"]:focus {
      border-color: var(--bx-blue-dark);
      box-shadow: 0 0 0 2px rgba(59, 200, 245, 0.2);
    }

    .input-qty-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .unit-label {
      font-size: 11px;
      color: var(--bx-muted);
      white-space: nowrap;
    }

    .error-banner {
      background: #ffe8e6;
      border: 1px solid #ffb4aa;
      color: #9b1c1c;
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-size: 12px;
      display: none;
    }

    .footer-buttons {
      margin-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .footer-left,
    .footer-right {
      display: flex;
      gap: 8px;
    }

    .summary-card {
      border: 1px solid var(--bx-border);
      border-radius: 6px;
      padding: 10px 12px;
      background: #fafbfc;
      font-size: 13px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: #555;
    }

    .summary-row.total {
      font-weight: 600;
      border-top: 1px solid #dde2ea;
      padding-top: 6px;
      margin-top: 6px;
      color: #000;
    }

    .summary-label { margin-right: 12px; }
    .summary-value { text-align: right; }

    .product-dropdown {
      position: fixed;
      z-index: 9999;
      background: #fff;
      border-radius: 4px;
      border: 1px solid #c5ced8;
      box-shadow: 0 4px 10px rgb(255, 255, 255);
      max-height: 600px;
      min-width: 320px;  
      display: none;
      overflow: hidden;
      font-size: 13px;
    }

    .product-dropdown.visible { display: block; }

    .product-dropdown-search {
      padding: 6px 8px;
      border-bottom: 1px solid #eef1f4;
      background: #fafbff;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .product-dropdown-search input {
      width: 100%;
      padding: 4px 6px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #c5ced8;
    }

    .product-dropdown-list {
      max-height: 500px;
      overflow: auto;
    }

    .product-row {
      padding: 6px 8px;
      border-bottom: 1px solid #f1f3f6;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .product-row:hover { background: #f3f7ff; }

    .product-row-name { font-size: 13px; }
    .product-row-meta {
      font-size: 11px;
      color: var(--bx-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
  </style>
</head>
<body>
  <div class="app-root">
  
    <div class="left-block">
      <div id="error-banner" class="error-banner"></div>

      <div class="toolbar-top">
        <div class="toolbar-top-left">
          <button class="btn btn-primary" id="btn-add-row">+ Добавить товар</button>
          <button class="btn btn-danger" id="btn-delete-selected" disabled>Удалить выбранные</button>
        </div>
        <div class="toolbar-top-right">
          <span class="tag" id="tag-deal-info">Сделка: неизвестно</span>
        </div>
      </div>

      <div class="products-table-wrapper">
        <table>
          <thead>
            <tr>
              <th class="col-index">#</th>
              <th class="col-checkbox">
                <input type="checkbox" id="cb-select-all">
              </th>
              <th class="col-product">Товар</th>
              <th class="col-price-list">Прайс-лист</th>
              <th class="col-price">Цена</th>
              <th class="col-qty">Кол-во</th>
              <th class="col-discount">Скидка, %</th>
              <th class="col-vat">НДС, %</th>
              <th class="col-total">Итого</th>
            </tr>
          </thead>
          <tbody id="lines-tbody"></tbody>
        </table>
      </div>

      <div class="footer-buttons">
        <div class="footer-left">
          <button class="btn" id="btn-recalc-selected">Пересчитать выбранные</button>
        </div>
        <div class="footer-right">
          <button class="btn" id="btn-manage-prices">Управление прайсами</button>
          <button class="btn" id="btn-cancel">Отмена</button>
          <button class="btn btn-success" id="btn-save">Сохранить</button>
        </div>
      </div>
    </div>

    <div class="right-block">
      <div class="summary-card">
        <div class="summary-row">
          <span class="summary-label">Сумма без скидки и налогов:</span>
          <span class="summary-value" id="sum-base">0.00</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Сумма скидки:</span>
          <span class="summary-value" id="sum-discount">0.00</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Сумма без налога:</span>
          <span class="summary-value" id="sum-no-vat">0.00</span>
        </div>
        <div class="summary-row">
          <span class="summary-label">Сумма налога:</span>
          <span class="summary-value" id="sum-vat">0.00</span>
        </div>
        <div class="summary-row total">
          <span class="summary-label">Общая сумма:</span>
          <span class="summary-value" id="sum-total">0.00</span>
        </div>
      </div>
    </div>
  </div>

  <div id="product-dropdown" class="product-dropdown">
    <div class="product-dropdown-search">
      <input type="text" id="product-search-input" placeholder="Поиск товара..." />
    </div>
    <div id="product-dropdown-list" class="product-dropdown-list"></div>
  </div>


  <div class="modal-backdrop" id="price-manager-backdrop">
    <div class="modal-dialog">
      <div class="modal-header">
        <div class="modal-title">Управление прайс-листами</div>
        <button class="modal-close-btn" id="pm-btn-close">&times;</button>
      </div>
      <div class="modal-body">
        
        <div class="price-list-sidebar">
          <div class="price-list-sidebar-header">
            <span>Прайс-листы</span>
            <input
              type="text"
              id="pm-search-input"
              class="price-list-search"
              placeholder="Поиск по названию..."
            >
          </div>
          <div class="price-list-sidebar-list" id="pm-price-list-container">
            
          </div>
        </div>

        <div class="price-list-form">
          <div class="price-list-actions">
            <button class="btn btn-primary" id="pm-btn-new">Новый прайс</button>
            <button class="btn" id="pm-btn-copy">Копировать</button>
            <button class="btn btn-danger" id="pm-btn-delete">Удалить</button>
          </div>

          <div class="price-list-form-row">
            <label for="pm-input-name">Название прайса</label>
            <input type="text" id="pm-input-name" placeholder="Например: Базовый прайс">
          </div>

          <div class="price-list-form-row">
            <label for="pm-input-description">Описание</label>
            <textarea id="pm-input-description" placeholder="Краткое описание прайса"></textarea>
          </div>

          <div class="price-list-form-meta" id="pm-meta">
            Товаров в прайсе: 0
          </div>

          <div class="price-items-wrapper">
            <div class="price-items-header">Товары в прайсе</div>
            <div class="price-items-table-container">
              <table class="price-items-table" id="pm-items-table">
                
              </table>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" id="pm-btn-cancel">Закрыть</button>
        <button class="btn btn-success" id="pm-btn-save">Сохранить</button>
      </div>
    </div>
  </div>

  <!-- контейнер для тост-уведомлений -->
  <div id="toast-container"></div>

  <script>
    
    let PRODUCTS = [];
    let PRICE_LISTS = [];
    let lines = [];

    const VAT_RATES = [0, 10, 20];
    const apiBase = ""; 

    let currentProductInput = null;
    let currentProductLine = null;
    let productDropdownEl = null;
    let productDropdownListEl = null;
    let productSearchInputEl = null;

    function formatMoney(value) {
      let num = Number(value);
      if (isNaN(num)) num = 0;

      num = num.toFixed(2);

      let parts = num.split(".");
      let intPart = parts[0];
      let decPart = parts[1];

      intPart = intPart.replace(/\B(?=(\d{3})+(?!\d))/g, " ");

      return `${intPart},${decPart}`;
    }

    function showError(message) {
      const banner = document.getElementById("error-banner");
      banner.textContent = message;
      banner.style.display = "block";
    }

    function clearError() {
      const banner = document.getElementById("error-banner");
      banner.textContent = "";
      banner.style.display = "none";
    }

    function createEmptyLine() {
      return {
        id: Date.now().toString() + Math.random().toString(16).slice(2),
        productId: null,
        productName: "",
        priceListId: PRICE_LISTS.length ? PRICE_LISTS[0].id : null,
        price: 0,
        quantity: 1,
        discountPercent: 0,
        vatPercent: 0,
        base: 0,
        discountAmount: 0,
        vatAmount: 0,
        total: 0,
        selected: false,
      };
    }

    function recalcLine(line) {
      const price = Number(line.price) || 0;
      const qty = Number(line.quantity) || 0;
      const discountPercent = Number(line.discountPercent) || 0;
      const vatPercent = Number(line.vatPercent) || 0;

      const base = price * qty;
      const discountAmount = base * (discountPercent / 100);
      const baseAfterDiscount = base - discountAmount;
      const vatAmount = baseAfterDiscount * (vatPercent / 100);
      const total = baseAfterDiscount + vatAmount;

      line.base = base;
      line.discountAmount = discountAmount;
      line.vatAmount = vatAmount;
      line.total = total;
    }

    function recalcAll() {
      lines.forEach(recalcLine);
      updateSummary();
    }

    function updateSummary() {
      let sumBase = 0;
      let sumDiscount = 0;
      let sumNoVat = 0;
      let sumVat = 0;
      let sumTotal = 0;

      lines.forEach(l => {
        sumBase += l.base;
        sumDiscount += l.discountAmount;
        const noVat = l.base - l.discountAmount;
        sumNoVat += noVat;
        sumVat += l.vatAmount;
        sumTotal += l.total;
      });

      document.getElementById("sum-base").textContent = formatMoney(sumBase);
      document.getElementById("sum-discount").textContent = formatMoney(sumDiscount);
      document.getElementById("sum-no-vat").textContent = formatMoney(sumNoVat);
      document.getElementById("sum-vat").textContent = formatMoney(sumVat);
      document.getElementById("sum-total").textContent = formatMoney(sumTotal);
    }

    async function fetchProducts() {
      const res = await fetch(apiBase + "/api/products/");
      if (!res.ok) throw new Error("Ошибка загрузки товаров");
      const data = await res.json() || [];

      const map = new Map();
      for (const p of data) {
        if (!p.id) continue;
        if (!map.has(p.id)) map.set(p.id, p);
      }
      PRODUCTS = Array.from(map.values()).sort((a, b) =>
        (a.name || "").localeCompare(b.name || "", "ru", { sensitivity: "base" })
      );
    }

    async function fetchPriceLists() {
      const res = await fetch(apiBase + "/api/prices/");
      if (!res.ok) throw new Error("Ошибка загрузки прайсов");
      PRICE_LISTS = await res.json() || [];
    }

    async function fetchPriceForLine(line) {
      if (!line.productId || !line.priceListId) return;
      const url = `${apiBase}/api/prices/${line.priceListId}/price?product_id=${encodeURIComponent(line.productId)}`;
      const res = await fetch(url);
      if (!res.ok) return;
      const data = await res.json();
      if (data && data.price != null) {
        line.price = Number(data.price) || 0;
      }
    }

    async function autoUpdatePriceAndRecalc(line) {
      await fetchPriceForLine(line);
      recalcLine(line);
      updateSummary();
      renderLines();
    }

    function openProductDropdown(inputEl, line) {
      currentProductInput = inputEl;
      currentProductLine = line;

      if (!productDropdownEl) return;

      const rect = inputEl.getBoundingClientRect();
      const top = rect.bottom + window.scrollY;
      const left = rect.left + window.scrollX;

      const extraWidth = 60;
      productDropdownEl.style.width = (rect.width + extraWidth) + "px";
      productDropdownEl.style.left = left + "px";
      productDropdownEl.style.top = top + "px";

      productSearchInputEl.value = "";
      renderProductDropdownList("");
      
      productDropdownEl.style.display = "block";
      productDropdownEl.classList.add("visible");
      setTimeout(() => productSearchInputEl.focus(), 10);
    }


    function closeProductDropdown() {
      if (!productDropdownEl) return;

        productDropdownEl.classList.remove("visible");
        productDropdownEl.style.display = "none";

        currentProductLine = null;
        currentProductInput = null;
        }

    function renderProductDropdownList(filterText = "") {
      if (!productDropdownListEl) return;
      productDropdownListEl.innerHTML = "";

      const q = filterText.toLowerCase().trim();

      const filtered = PRODUCTS.filter(p => {
        if (!q) return true;
        const name = (p.name || "").toLowerCase();
        const desc = (p.description || "").toLowerCase();
        return name.includes(q) || desc.includes(q);
      });

      filtered.forEach(p => {
        const row = document.createElement("div");
        row.className = "product-row";

        const nameEl = document.createElement("div");
        nameEl.className = "product-row-name";
        nameEl.textContent = p.name || "(без названия)";

        const metaEl = document.createElement("div");
        metaEl.className = "product-row-meta";
        const price = Number(p.price) || 0;
        const currency = p.currency_id || "RUB";
        const priceText = price ? `${formatMoney(price)} ${currency}` : "цена не указана";
        const desc = (p.description || "").replace(/\s+/g, " ");
        metaEl.textContent = desc ? `${priceText} • ${desc}` : priceText;

        row.appendChild(nameEl);
        row.appendChild(metaEl);

        row.addEventListener("click", async (e) => {
          e.stopPropagation();
            if (!currentProductLine || !currentProductInput) return;

            currentProductLine.productId = p.id;
            currentProductLine.productName = p.name || "";
            currentProductInput.value = p.name || "";

            const lineRef = currentProductLine;

            closeProductDropdown();

            await autoUpdatePriceAndRecalc(lineRef);
        });

        productDropdownListEl.appendChild(row);
      });
    }

    function renderLines() {
      const tbody = document.getElementById("lines-tbody");
      tbody.innerHTML = "";

      lines.forEach((line, index) => {
        const tr = document.createElement("tr");
        if (line.selected) tr.classList.add("selected");

        
        const tdIndex = document.createElement("td");
        tdIndex.className = "col-index";
        tdIndex.textContent = index + 1;
        tr.appendChild(tdIndex);

        
        const tdCheckbox = document.createElement("td");
        tdCheckbox.className = "col-checkbox";
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.checked = line.selected;
        cb.addEventListener("change", () => {
          line.selected = cb.checked;
          renderLines();
        });
        tdCheckbox.appendChild(cb);
        tr.appendChild(tdCheckbox);

        const tdProduct = document.createElement("td");
        tdProduct.className = "col-product";
        const inputProduct = document.createElement("input");
        inputProduct.type = "text";
        inputProduct.placeholder = "— выбрать товар —";
        inputProduct.value = line.productName || "";

        inputProduct.addEventListener("focus", () => {
          openProductDropdown(inputProduct, line);
        });
        inputProduct.addEventListener("click", (e) => {
          e.stopPropagation();
          openProductDropdown(inputProduct, line);
        });

        
        inputProduct.addEventListener("input", () => {
          line.productName = inputProduct.value;
        });

        tdProduct.appendChild(inputProduct);
        tr.appendChild(tdProduct);

        
        const tdPriceList = document.createElement("td");
        tdPriceList.className = "col-price-list";
        const selectPriceList = document.createElement("select");
        PRICE_LISTS.forEach(pl => {
          const opt = document.createElement("option");
          opt.value = pl.id;
          opt.textContent = pl.name;
          if (pl.id === line.priceListId) opt.selected = true;
          selectPriceList.appendChild(opt);
        });
        selectPriceList.addEventListener("change", async () => {
          line.priceListId = Number(selectPriceList.value) || null;
          if (line.productId) {
            await autoUpdatePriceAndRecalc(line);
          }
        });
        tdPriceList.appendChild(selectPriceList);
        tr.appendChild(tdPriceList);

        
        const tdPrice = document.createElement("td");
        tdPrice.className = "col-price";
        const inputPrice = document.createElement("input");
        inputPrice.type = "text";

        inputPrice.step = "1";
        inputPrice.value = formatMoney(line.price || 0);

        inputPrice.addEventListener("focus", () => {
          const num = Number(line.price) || 0;
         
          inputPrice.value = num.toString().replace(".", ",");
        });

        inputPrice.addEventListener("blur", () => {
          let raw = inputPrice.value || "";

          raw = raw.replace(/\s+/g, "").replace(",", ".");

          let num = Number(raw);
          if (isNaN(num)) num = 0;

          line.price = num;
          recalcLine(line);
          updateSummary();

          inputPrice.value = formatMoney(line.price);
          tdTotal.textContent = formatMoney(line.total);
        });

        tdPrice.appendChild(inputPrice);
        tr.appendChild(tdPrice);

        
        const tdQty = document.createElement("td");
        tdQty.className = "col-qty";
        const qtyWrapper = document.createElement("div");
        qtyWrapper.className = "input-qty-wrapper";
        const inputQty = document.createElement("input");
        inputQty.type = "number";
        inputQty.min = "0";
        inputQty.step = "1";
        inputQty.value = line.quantity;
        inputQty.addEventListener("input", () => {
          line.quantity = Number(inputQty.value) || 0;
          recalcLine(line);
          updateSummary();
          tdTotal.textContent = formatMoney(line.total);
        });
        const unitSpan = document.createElement("span");
        unitSpan.className = "unit-label";
        unitSpan.textContent = "шт";
        qtyWrapper.appendChild(inputQty);
        qtyWrapper.appendChild(unitSpan);
        tdQty.appendChild(qtyWrapper);
        tr.appendChild(tdQty);

        
        const tdDiscount = document.createElement("td");
        tdDiscount.className = "col-discount";
        const inputDiscount = document.createElement("input");
        inputDiscount.type = "number";
        inputDiscount.min = "0";
        inputDiscount.max = "100";
        inputDiscount.step = "1";
        inputDiscount.value = line.discountPercent;
        inputDiscount.addEventListener("input", () => {
          line.discountPercent = Number(inputDiscount.value) || 0;
          recalcLine(line);
          updateSummary();
          tdTotal.textContent = formatMoney(line.total);
        });
        tdDiscount.appendChild(inputDiscount);
        tr.appendChild(tdDiscount);

        
        const tdVat = document.createElement("td");
        tdVat.className = "col-vat";
        const selectVat = document.createElement("select");
        VAT_RATES.forEach(rate => {
          const opt = document.createElement("option");
          opt.value = rate;
          opt.textContent = rate === 0 ? "0 %" : rate + " %";
          if (rate === line.vatPercent) opt.selected = true;
          selectVat.appendChild(opt);
        });
        selectVat.addEventListener("change", () => {
          line.vatPercent = Number(selectVat.value) || 0;
          recalcLine(line);
          updateSummary();
          tdTotal.textContent = formatMoney(line.total);
        });
        tdVat.appendChild(selectVat);
        tr.appendChild(tdVat);

        
        const tdTotal = document.createElement("td");
        tdTotal.className = "col-total";
        tdTotal.textContent = formatMoney(line.total);
        tr.appendChild(tdTotal);

        tbody.appendChild(tr);
      });

      const anySelected = lines.some(l => l.selected);
      document.getElementById("btn-delete-selected").disabled = !anySelected;
    }

    
    async function initApp() {
      clearError();
      try {
        await Promise.all([fetchProducts(), fetchPriceLists()]);

        if (lines.length === 0) {
          lines.push(createEmptyLine());
          recalcAll();
        } else {
          recalcAll();
        }
        renderLines();
      } catch (e) {
        console.error(e);
        showError("Ошибка инициализации: " + e.message);
      }
    }
    
    // ------------------ Модалка управления прайсами ------------------
    let pmSelectedId = null;      
    let pmSearchTerm = "";        
    let pmItems = [];            
    let pmItemsDirty = false;    
    let pmDragState = {
      dragging: false,
      offsetX: 0,
      offsetY: 0,
    };

    function enablePriceManagerDragging() {
      const backdrop = document.getElementById("price-manager-backdrop");
      if (!backdrop) return;
      const dialog = backdrop.querySelector(".modal-dialog");
      const header = dialog.querySelector(".modal-header");

      header.addEventListener("mousedown", (e) => {
        pmDragState.dragging = true;
        pmDragState.offsetX = e.clientX - dialog.offsetLeft;
        pmDragState.offsetY = e.clientY - dialog.offsetTop;
        dialog.style.position = "absolute";
        dialog.style.margin = 0;
        document.body.style.userSelect = "none";
      });

      document.addEventListener("mousemove", (e) => {
        if (!pmDragState.dragging) return;
        dialog.style.left = e.clientX - pmDragState.offsetX + "px";
        dialog.style.top = e.clientY - pmDragState.offsetY + "px";
      });

      document.addEventListener("mouseup", () => {
        pmDragState.dragging = false;
        document.body.style.userSelect = "";
      });
    }

    function showToast(message, type = "success") {
      const container = document.getElementById("toast-container");
      if (!container) return;

      const toast = document.createElement("div");
      toast.className = "toast";
      if (type !== "success") {
        toast.style.background = "#ff726c";
      }
      toast.textContent = message;

      container.appendChild(toast);

      setTimeout(() => {
        toast.classList.add("visible");
      }, 10);

      setTimeout(() => {
        toast.classList.remove("visible");
        setTimeout(() => {
          container.removeChild(toast);
        }, 200);
      }, 2500);
    }

    function openPriceManager() {
      const backdrop = document.getElementById("price-manager-backdrop");
      if (!backdrop) return;

      const dialog = backdrop.querySelector(".modal-dialog");
      dialog.style.position = "";
      dialog.style.left = "";
      dialog.style.top = "";
      dialog.style.margin = "";

      backdrop.classList.add("visible");
      backdrop.style.display = "flex";

      enablePriceManagerDragging();

      pmSearchTerm = "";
      const searchInput = document.getElementById("pm-search-input");
      if (searchInput) searchInput.value = "";

      loadPriceListsForManager();
    }

    function closePriceManager() {
      const backdrop = document.getElementById("price-manager-backdrop");
      if (!backdrop) return;

      backdrop.classList.remove("visible");
      backdrop.style.display = "none";
    }

    function getFilteredPriceLists() {
      if (!pmSearchTerm) return PRICE_LISTS;
      const term = pmSearchTerm.toLowerCase();
      return PRICE_LISTS.filter(pl =>
        (pl.name || "").toLowerCase().includes(term)
      );
    }

    async function loadPriceListsForManager(selectId = null) {
      try {
        await fetchPriceLists();

        const container = document.getElementById("pm-price-list-container");
        container.innerHTML = "";

        const filtered = getFilteredPriceLists();

        if (!filtered.length) {
          container.textContent = "Прайс-листы не найдены.";
          pmSelectedId = null;
          fillPriceManagerForm(null);
          pmItems = [];
          pmItemsDirty = false;
          renderPriceItemsTable();
          return;
        }

        if (selectId === null) {
          selectId = filtered[0].id;
        }
        pmSelectedId = selectId;

        filtered.forEach(pl => {
          const row = document.createElement("div");
          row.className = "price-list-item";
          if (pl.id === pmSelectedId) row.classList.add("active");

          const nameSpan = document.createElement("div");
          nameSpan.className = "price-list-item-name";
          nameSpan.textContent = pl.name || "Без названия";

          const countSpan = document.createElement("div");
          countSpan.className = "price-list-item-count";
          const cnt = typeof pl.items_count === "number" ? pl.items_count : 0;
          countSpan.textContent = cnt + " поз.";

          row.appendChild(nameSpan);
          row.appendChild(countSpan);

          row.addEventListener("click", async () => {
            pmSelectedId = pl.id;
            renderPriceListsSidebar();
            fillPriceManagerForm(pl);
            await loadPriceItemsForCurrentPriceList();
          });

          container.appendChild(row);
        });

        const selected = PRICE_LISTS.find(p => p.id === pmSelectedId) || filtered[0];
        fillPriceManagerForm(selected);
        renderPriceListsSidebar();
        await loadPriceItemsForCurrentPriceList();
      } catch (e) {
        console.error("Ошибка загрузки прайсов для модалки:", e);
        alert("Ошибка загрузки списка прайсов");
      }
    }

    function renderPriceListsSidebar() {
      const container = document.getElementById("pm-price-list-container");
      const rows = container.querySelectorAll(".price-list-item");
      const filtered = getFilteredPriceLists();

      rows.forEach((row, index) => {
        const pl = filtered[index];
        if (!pl) return;
        if (pl.id === pmSelectedId) {
          row.classList.add("active");
        } else {
          row.classList.remove("active");
        }
      });
    }

    function fillPriceManagerForm(priceList) {
      const nameInput = document.getElementById("pm-input-name");
      const descInput = document.getElementById("pm-input-description");
      const metaEl = document.getElementById("pm-meta");

      if (!priceList) {
        nameInput.value = "";
        descInput.value = "";
        metaEl.textContent = "Товаров в прайсе: 0";
        return;
      }

      nameInput.value = priceList.name || "";
      descInput.value = priceList.description || "";

      const cnt = typeof priceList.items_count === "number" ? priceList.items_count : 0;
      metaEl.textContent = "Товаров в прайсе: " + cnt;
    }

    async function loadPriceItemsForCurrentPriceList() {
      pmItems = [];
      pmItemsDirty = false;
      renderPriceItemsTable();

      if (!pmSelectedId) return;

      try {
        const res = await fetch(apiBase + `/api/prices/${pmSelectedId}/items`);
        if (!res.ok) throw new Error("Ошибка загрузки товаров прайса");
        const data = await res.json() || [];

        pmItems = data;
        pmItemsDirty = false;
        renderPriceItemsTable();
      } catch (e) {
        console.error(e);
        alert("Не удалось загрузить товары прайса");
      }
    }

    
    function renderPriceItemsTable() {
      const table = document.getElementById("pm-items-table");
      if (!table) return;

      const metaEl = document.getElementById("pm-meta");

      if (!pmItems || !pmItems.length) {
        table.innerHTML = `
          <thead>
            <tr>
              <th style="width:40px;">#</th>
              <th>Название</th>
              <th>Описание</th>
              <th style="width:90px;">Цена</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4" style="padding:8px;color:#888;">Нет товаров для отображения.</td>
            </tr>
          </tbody>
        `;
        if (metaEl) metaEl.textContent = "Товаров в прайсе: 0";
        return;
      }

      let html = `
        <thead>
          <tr>
            <th style="width:40px;">#</th>
            <th>Название</th>
            <th>Описание</th>
            <th style="width:90px;">Цена</th>
          </tr>
        </thead>
        <tbody>
      `;

      pmItems.forEach((item, index) => {
        const name = item.product_name || "";
        const desc = item.product_description || "";
        const price = item.price != null ? item.price : 0;

        html += `
          <tr>
            <td>${index + 1}</td>
            <td>
              <input
                type="text"
                class="price-item-name-input"
                data-index="${index}"
                value="${name.replace(/"/g, '&quot;')}"
              >
            </td>
            <td>
              <input
                type="text"
                class="price-item-desc-input"
                data-index="${index}"
                value="${(desc || "").replace(/"/g, '&quot;')}"
              >
            </td>
            <td>
              <input
                type="text"
                class="price-item-price-input"
                data-index="${index}"
                value="${formatMoney(price)}"
              >
            </td>
          </tr>
        `;
      });

      html += "</tbody>";
      table.innerHTML = html;

      if (metaEl) metaEl.textContent = "Товаров в прайсе: " + pmItems.length;

      // --- обработчики названия ---
      const nameInputs = table.querySelectorAll(".price-item-name-input");
      nameInputs.forEach(input => {
        input.addEventListener("blur", () => {
          const idx = Number(input.dataset.index);
          if (isNaN(idx) || !pmItems[idx]) return;
          pmItems[idx].product_name = input.value || "";
          pmItemsDirty = true;
        });
      });

      // --- обработчики описания ---
      const descInputs = table.querySelectorAll(".price-item-desc-input");
      descInputs.forEach(input => {
        input.addEventListener("blur", () => {
          const idx = Number(input.dataset.index);
          if (isNaN(idx) || !pmItems[idx]) return;
          pmItems[idx].product_description = input.value || "";
          pmItemsDirty = true;
        });
      });

      // --- обработчики цены ---
      const priceInputs = table.querySelectorAll(".price-item-price-input");
      priceInputs.forEach(input => {
        input.addEventListener("focus", () => {
          const idx = Number(input.dataset.index);
          const item = pmItems[idx];
          const num = Number(item.price) || 0;
          input.value = num.toString().replace(".", ",");
        });

        input.addEventListener("blur", () => {
          const idx = Number(input.dataset.index);
          const item = pmItems[idx];
          let raw = input.value || "";
          raw = raw.replace(/\s+/g, "").replace(",", ".");
          let num = Number(raw);
          if (isNaN(num)) num = 0;
          item.price = num;
          pmItemsDirty = true;
          input.value = formatMoney(item.price);
        });
      });
    }


    function pmNewPriceList() {
      pmSelectedId = null;
      pmItems = [];
      pmItemsDirty = false;
      fillPriceManagerForm(null);
      renderPriceListsSidebar();
      renderPriceItemsTable();
    }

    async function pmSavePriceList() {
      const nameInput = document.getElementById("pm-input-name");
      const descInput = document.getElementById("pm-input-description");

      const name = (nameInput.value || "").trim();
      const description = (descInput.value || "").trim();

      if (!name) {
        alert("Введите название прайса");
        return;
      }

      const wasNew = (pmSelectedId == null);

      try {
        let savedId = pmSelectedId;

        if (pmSelectedId == null) {
          
          const res = await fetch(apiBase + "/api/prices/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, description })
          });
          if (!res.ok) throw new Error("Ошибка создания прайса");
          const created = await res.json();
          savedId = created.id;
          pmSelectedId = savedId;
        } else {
          
          const res = await fetch(apiBase + `/api/prices/${pmSelectedId}`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ name, description })
          });
          if (!res.ok) throw new Error("Ошибка сохранения прайса");
        }

        
        if (pmItemsDirty && savedId != null) {
          const resItems = await fetch(apiBase + `/api/prices/${savedId}/items`, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ items: pmItems })
          });
          if (!resItems.ok) throw new Error("Ошибка сохранения цен в прайсе");
          pmItemsDirty = false;
        }

        await loadPriceListsForManager(savedId);
        await fetchPriceLists();
        renderLines();

        showToast(wasNew ? "Прайс создан" : "Прайс сохранён");
      } catch (e) {
        console.error(e);
        alert(e.message || "Ошибка сохранения прайс-листа");
      }
    }

    
    async function pmCopyPriceList() {
      if (pmSelectedId == null) {
        alert("Сначала выберите прайс для копирования");
        return;
      }
      try {
        const res = await fetch(apiBase + `/api/prices/${pmSelectedId}/copy`, {
          method: "POST"
        });
        if (!res.ok) throw new Error("Ошибка копирования прайса");
        const created = await res.json();
        await loadPriceListsForManager(created.id);
        await fetchPriceLists();
        showToast("Прайс скопирован");
      } catch (e) {
        console.error(e);
        alert(e.message || "Ошибка копирования прайс-листа");
      }
    }

    
    async function pmDeletePriceList() {
      if (pmSelectedId == null) {
        alert("Сначала выберите прайс для удаления");
        return;
      }

      const pl = PRICE_LISTS.find(p => p.id === pmSelectedId);
      const name = pl ? pl.name : pmSelectedId;

      if (!confirm(`Удалить прайс "${name}"? Это действие необратимо.`)) {
        return;
      }

      try {
        const res = await fetch(apiBase + `/api/prices/${pmSelectedId}`, {
          method: "DELETE"
        });
        if (!res.ok) throw new Error("Ошибка удаления прайса");

        pmSelectedId = null;
        pmItems = [];
        pmItemsDirty = false;

        await loadPriceListsForManager(null);
        await fetchPriceLists();
        renderLines();

        showToast("Прайс удалён");
      } catch (e) {
        console.error(e);
        alert(e.message || "Ошибка удаления прайс-листа");
      }
    }
    
    
    document.addEventListener("DOMContentLoaded", () => {
      productDropdownEl = document.getElementById("product-dropdown");
      productDropdownListEl = document.getElementById("product-dropdown-list");
      productSearchInputEl = document.getElementById("product-search-input");

      // поиск внутри дропдауна
      productSearchInputEl.addEventListener("input", () => {
        renderProductDropdownList(productSearchInputEl.value);
      });

      // клик по фону закрывает дропдаун
      document.addEventListener("click", (e) => {
        if (!productDropdownEl) return;
        if (!productDropdownEl.classList.contains("visible")) return;
        if (
          !productDropdownEl.contains(e.target) &&
          e.target !== currentProductInput
        ) {
          closeProductDropdown();
        }
      });

      // Добавить строку
      document.getElementById("btn-add-row").addEventListener("click", () => {
        const line = createEmptyLine();
        lines.push(line);
        recalcAll();
        renderLines();
      });

      // Удалить выбранные
      document.getElementById("btn-delete-selected").addEventListener("click", () => {
        lines = lines.filter(l => !l.selected);
        if (lines.length === 0) {
          lines.push(createEmptyLine());
        }
        recalcAll();
        renderLines();
      });

      // Пересчитать выбранные
      document.getElementById("btn-recalc-selected").addEventListener("click", async () => {
        for (const line of lines) {
          if (!line.selected) continue;
          await fetchPriceForLine(line);
          recalcLine(line);
        }
        updateSummary();
        renderLines();
      });

      // кнопка "Управление прайсами"
      document.getElementById("btn-manage-prices").addEventListener("click", () => {
        openPriceManager();
      });

      // кнопки модалки "Управление прайсами"
      const pmBackdrop = document.getElementById("price-manager-backdrop");
      const pmBtnClose = document.getElementById("pm-btn-close");
      const pmBtnCancel = document.getElementById("pm-btn-cancel");
      const pmBtnNew = document.getElementById("pm-btn-new");
      const pmBtnSave = document.getElementById("pm-btn-save");
      const pmBtnCopy = document.getElementById("pm-btn-copy");
      const pmBtnDelete = document.getElementById("pm-btn-delete");
      const pmSearchInput = document.getElementById("pm-search-input");

      if (pmBtnClose) pmBtnClose.addEventListener("click", closePriceManager);
      if (pmBtnCancel) pmBtnCancel.addEventListener("click", closePriceManager);
      if (pmBackdrop) {
        pmBackdrop.addEventListener("click", (e) => {
          if (e.target === pmBackdrop) {
            closePriceManager();
          }
        });
      }
      if (pmBtnNew) pmBtnNew.addEventListener("click", pmNewPriceList);
      if (pmBtnSave) pmBtnSave.addEventListener("click", pmSavePriceList);
      if (pmBtnCopy) pmBtnCopy.addEventListener("click", pmCopyPriceList);
      if (pmBtnDelete) pmBtnDelete.addEventListener("click", pmDeletePriceList);

      if (pmSearchInput) {
        pmSearchInput.addEventListener("input", (e) => {
          pmSearchTerm = e.target.value || "";
          loadPriceListsForManager(pmSelectedId);
        });
      }


      document.getElementById("btn-cancel").addEventListener("click", () => {
        if (window.BX24 && BX24.closeApplication) {
          BX24.closeApplication();
        } else {
          alert("Отмена. В режиме разработки просто закройте вкладку.");
        }
      });

      document.getElementById("btn-save").addEventListener("click", () => {
        console.log("Строки для сохранения в CRM:", lines);
        alert("Сохранение в CRM ещё не реализовано.");
      });

      const cbSelectAll = document.getElementById("cb-select-all");
      if (cbSelectAll) {
        cbSelectAll.addEventListener("change", () => {
          const checked = cbSelectAll.checked;
          lines.forEach(l => { l.selected = checked; });
          recalcAll();
          renderLines();
        });
      }
      // Получаем ID сделки из Bitrix
      if (window.BX24) {
        BX24.ready(function() {
          BX24.init(function() {
            BX24.getAuth(() => {});
            BX24.callMethod("placement.getData", {}, function(res) {
              try {
                const data = res.data();
                const dealId = data?.ID || data?.entityId || "неизвестно";
                document.getElementById("tag-deal-info").textContent = "Сделка: " + dealId;
              } catch (e) {
                console.warn("placement.getData error:", e);
              }
            });
          });
        });
      }

      initApp();
    });
  </script>
</body>
</html>
