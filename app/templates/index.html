          async function loadPriceListsForManager(autoSelect = true) {
            try {
              // refresh lists from backend to keep new changes
              await fetchPriceLists();

              renderPriceListsSidebar();

              // auto select:
              // 1) keep current selection if exists
              // 2) default from localStorage
              // 3) first list
              if (autoSelect) {
                let target = pmSelectedId;

                if (!target) {
                  const def = getDefaultPriceListId();
                  if (def && PRICE_LISTS.some(pl => String(pl.id) === String(def))) target = String(def);
                }

                if (!target && PRICE_LISTS.length) target = String(PRICE_LISTS[0].id);

                if (target) await selectPriceList(target);
              }
            } catch (e) {
              console.error(e);
              showToast("Ошибка загрузки прайсов: " + (e.message || e), "error");
            }
          }

          async function selectPriceList(id) {
            pmSelectedId = String(id);

            renderPriceListsSidebar();

            const pl = PRICE_LISTS.find(x => String(x.id) === String(pmSelectedId));

            // ✅ важное: сбрасываем текущее состояние ДО заполнения формы,
            // чтобы нигде не использовались данные предыдущего прайса
            pmItems = [];
            pmItemsDirty = false;
            renderPriceItemsTable();

            // ✅ meta сразу покажет корректное количество из списка (items_count),
            // а не от предыдущего прайса
            fillPriceListForm(pl);

            try {
              const items = await apiGetPriceListItems(pmSelectedId);

              pmItems = items.map(x => ({
                product_id: x.product_id ?? x.PRODUCT_ID ?? x.id ?? x.productId,
                product_name: x.product_name ?? x.PRODUCT_NAME ?? x.name ?? x.productName ?? "",
                product_description: x.product_description ?? x.PRODUCT_DESCRIPTION ?? x.description ?? x.productDescription ?? "",
                price: toNumberMoney(x.price ?? x.PRICE ?? x.base_price ?? x.BASE_PRICE ?? 0),
                selected: false
              })).filter(x => x.product_id != null);

              // cache membership set for dropdown "not in price"
              const set = new Set(pmItems.map(it => String(it.product_id)));
              PRICE_LIST_PRODUCT_IDS_CACHE.set(String(pmSelectedId), set);

              renderPriceItemsTable();

              // ✅ после загрузки — показываем уже фактическое количество
              updatePmMeta(pmItems.length);

            } catch (e) {
              console.error(e);
              showToast("Ошибка загрузки товаров прайса", "error");
              updatePmMeta(0);
            }
          }


          async function pmSaveAll() {
            if (!pmSelectedId) {
              showToast("Не выбран прайс-лист", "error");
              return;
            }

            const nameEl = document.getElementById("pm-input-name");
            const descEl = document.getElementById("pm-input-description");

            const name = nameEl ? String(nameEl.value || "").trim() : "";
            const description = descEl ? String(descEl.value || "").trim() : "";

            if (!name) {
              showToast("Укажите название прайса", "error");
              return;
            }

            // save meta
            try {
              // если это черновик — сначала создаём прайс в БД
              if (pmIsDraft) {
                const created = await apiCreatePriceList({ name, description });

                const newId = String(created.id ?? created.result?.id ?? created.price_list_id ?? created.priceListId ?? "");
                if (!newId) throw new Error("Не удалось получить ID созданного прайса");

                // заменяем draft в PRICE_LISTS на реальный объект
                const idx = PRICE_LISTS.findIndex(x => String(x.id) === String(pmSelectedId));
                if (idx >= 0) {
                  PRICE_LISTS[idx] = {
                    ...PRICE_LISTS[idx],
                    id: newId,
                    name,
                    description,
                    __isDraft: false
                  };
                }

                pmSelectedId = newId;
                pmIsDraft = false;
              } else {
                // обычное сохранение меты
                await apiSavePriceListMeta(pmSelectedId, { name, description });
              }

              // сохраняем товары прайса
              const itemsPayload = (pmItems || []).map(it => ({
                product_id: it.product_id,
                price: toNumberMoney(it.price)
              }));

              await apiSavePriceListItems(pmSelectedId, itemsPayload);

              // refresh
              pmItemsDirty = false;
              PRICE_LIST_PRODUCT_IDS_CACHE.delete(String(pmSelectedId));
              await ensurePriceListProductIds(pmSelectedId);

              await fetchPriceLists();
              renderPriceListsSidebar();

              showToast("Прайс сохранён", "success");
            } catch (e) {
              console.error(e);

              // если бэк вернул 409 — имя занято
              const msg = (e && e.message) ? e.message : String(e);
              if (msg.includes("409")) {
                showToast("Прайс-лист с таким названием уже существует", "error");
              } else {
                showToast("Ошибка сохранения прайса: " + msg, "error");
              }
            }
          }

          async function pmCreateNew() {
            if (pmItemsDirty) {
              if (!confirmNoUnsavedToast("Есть несохранённые изменения.\nСоздать новый прайс без сохранения текущего?")) {
                return;
              }
            }

            // создаём черновик ТОЛЬКО на фронте
            const draftId = makeDraftId();
            const draft = {
              id: draftId,
              name: "Новый прайс",
              description: "",
              items_count: PRODUCTS.length || 0,
              __isDraft: true
            };

            PRICE_LISTS.unshift(draft);
            pmSelectedId = String(draftId);
            pmIsDraft = true;

            // ✅ ВАЖНО: новый прайс (даже черновик) сразу содержит ВСЕ товары
            pmItems = (PRODUCTS || []).map(p => ({
              product_id: p.id,
              product_name: p.name || "",
              product_description: p.description || "",
              price: getProductBasePrice(p),   // берём базовую цену товара (как и раньше)
              selected: false
            }));

            // ✅ обновляем membership cache для подсветок/проверок
            PRICE_LIST_PRODUCT_IDS_CACHE.set(
              String(pmSelectedId),
              new Set(pmItems.map(it => String(it.product_id)))
            );

            // черновик не сохранён — считаем как "есть несохранённые изменения"
            pmItemsDirty = true;

            renderPriceListsSidebar();
            fillPriceListForm(draft);     // тут обновится "Товаров в прайсе: N"
            renderPriceItemsTable();
          }



          async function pmCopySelected() {
            if (!pmSelectedId) {
              showToast("Не выбран прайс-лист", "error");
              return;

            if (pmItemsDirty) {
              if (!confirmNoUnsavedToast("Есть несохранённые изменения.\nКопировать без сохранения текущего?")) {

          async function pmDeleteSelected() {
            if (!pmSelectedId) {
              showToast("Не выбран прайс-лист", "error");
              return;
            }

            if (!confirmNoUnsavedToast("Удалить выбранный прайс-лист?")) return;

            try {
              await apiDeletePriceList(pmSelectedId);

              // cleanup caches
              PRICE_LIST_PRODUCT_IDS_CACHE.delete(String(pmSelectedId));

              pmItemsDirty = false;

              await fetchPriceLists();
              renderPriceListsSidebar();

              if (PRICE_LISTS.length) await selectPriceList(PRICE_LISTS[0].id);
              else fillPriceListForm(null);

              showToast("Прайс удалён", "success");

          async function pmMakeDefault() {

              showToast("Не выбран прайс-лист", "error");
              return;
            }

            // old behavior: default stored locally + (optional) in quote field

          function pmDeleteSelectedItems() {
            const before = pmItems.length;
            pmItems = pmItems.filter(x => !x.selected);
            if (pmItems.length !== before) {
              pmItemsDirty = true;
              renderPriceItemsTable();
              updatePmMeta(pmItems.length);
            }
          }

          // -------------------- renderProductDropdownList (shared) --------------------
          function renderProductDropdownList(filterText = "") {
            if (!productDropdownListEl) return;
            productDropdownListEl.innerHTML = "";

            const q = filterText.toLowerCase().trim();

            const filtered = PRODUCTS.filter(p => {
              if (!q) return true;
              const name = (p.name || "").toLowerCase();
              const desc = (p.description || "").toLowerCase();
              return name.includes(q) || desc.includes(q);
            });

            filtered.forEach(p => {
              const row = document.createElement("div");
              row.className = "product-row";

              const nameEl = document.createElement("div");
              nameEl.className = "product-row-name";
              nameEl.textContent = p.name || "(без названия)";

              const metaEl = document.createElement("div");
              metaEl.className = "product-row-meta";
              const price = Number(p.price) || 0;
              const currency = p.currency_id || "RUB";
              const priceText = price ? `${formatMoney(price)} ${currency}` : "цена не указана";
              metaEl.textContent = priceText;

              row.appendChild(nameEl);
              row.appendChild(metaEl);

              // mark products not in selected price list
              if (productDropdownMode === "line" && currentProductLine?.priceListId) {
                const plKey = String(currentProductLine.priceListId);
                const set = PRICE_LIST_PRODUCT_IDS_CACHE.get(plKey);
                if (set && !set.has(String(p.id))) row.classList.add("not-in-price");
              }
              if (productDropdownMode === "pm_add" && pmSelectedId) {
                const set = PRICE_LIST_PRODUCT_IDS_CACHE.get(String(pmSelectedId));
                if (set && set.has(String(p.id))) {
                  row.classList.add("already-in-price");
                  // Добавляем текст через JavaScript
                  const nameEl = row.querySelector(".product-row-name");
                  if (nameEl && !nameEl.querySelector(".status-badge")) {
                    const badge = document.createElement("span");
                    badge.className = "status-badge already";
                    badge.textContent = "уже есть в прайсе";
                    nameEl.appendChild(badge);
                  }
                }
              }

              row.addEventListener("click", async (e) => {
                e.stopPropagation();

                if (productDropdownMode === "pm_add") {
                  if (!pmSelectedId) {
                    showToast("Сначала выберите прайс-лист", "error");
                    closeProductDropdown();
                    return;
                  }

                  const exists = pmItems.some(it => String(it.product_id) === String(p.id));
                  if (exists) {
                    showToast("Этот товар уже есть в прайс-листе", "error");
                    closeProductDropdown();
                    return;
                  }

                  const basePrice = getProductBasePrice(p);
                  pmItems.push({
                    product_id: p.id,
                    product_name: p.name || "",
                    product_description: p.description || "",
                    price: basePrice,
                    selected: false
                  });

                  pmItemsDirty = true;

                  // update cache set for "not in price"
                  const set = PRICE_LIST_PRODUCT_IDS_CACHE.get(String(pmSelectedId)) || new Set();
                  set.add(String(p.id));
                  PRICE_LIST_PRODUCT_IDS_CACHE.set(String(pmSelectedId), set);

                  closeProductDropdown();
                  renderPriceItemsTable();
                  return;
                }

                // line mode
                if (productDropdownMode === "line" && currentProductLine?.priceListId) {
                  const plId = String(currentProductLine.priceListId);
                  const set = PRICE_LIST_PRODUCT_IDS_CACHE.get(plId);
                  if (set && !set.has(String(p.id))) {
                    showToast("Товар отсутствует в выбранном прайс-листе. Цена будет 0 — укажите вручную.", "error");
                  }
                }

                if (!currentProductLine || !currentProductInput) return;

                currentProductLine.productId = p.id;
                currentProductLine.productName = p.name || "";
                currentProductInput.value = p.name || "";

                const lineRef = currentProductLine;
                closeProductDropdown();
                await autoUpdatePriceAndRecalc(lineRef);
                markDirty();
              });

              productDropdownListEl.appendChild(row);
            });
          }

          // -------------------- RENDER TABLE --------------------
          function renderLines() {
            if (productDropdownEl && productDropdownEl.classList.contains("visible")) {
              closeProductDropdown();
            }

            const tbody = document.getElementById("lines-tbody");
            if (!tbody) return;
            tbody.innerHTML = "";

            lines.forEach((line, index) => {
              const tr = document.createElement("tr");
              if (line.selected) tr.classList.add("selected");

              const tdIndex = document.createElement("td");
              tdIndex.className = "col-index";
              tdIndex.textContent = index + 1;
              tr.appendChild(tdIndex);

              const tdCheckbox = document.createElement("td");
              tdCheckbox.className = "col-checkbox";
              const cb = document.createElement("input");
              cb.type = "checkbox";
              cb.checked = line.selected;
              cb.addEventListener("change", () => {
                line.selected = cb.checked;
                renderLines();
              });
              tdCheckbox.appendChild(cb);
              tr.appendChild(tdCheckbox);

              const tdProduct = document.createElement("td");
              tdProduct.className = "col-product";
              const inputProduct = document.createElement("input");
              inputProduct.type = "text";
              inputProduct.placeholder = "— выбрать товар —";
              inputProduct.value = line.productName || "";

              inputProduct.addEventListener("focus", () => openProductDropdown(inputProduct, line));
              inputProduct.addEventListener("click", (e) => {
                e.stopPropagation();
                openProductDropdown(inputProduct, line);
              });

              inputProduct.addEventListener("input", () => {
                line.productName = inputProduct.value;
                markDirty();
              });

              tdProduct.appendChild(inputProduct);
              tr.appendChild(tdProduct);

              const tdPriceList = document.createElement("td");
              tdPriceList.className = "col-price-list";
              const selectPriceList = document.createElement("select");

              PRICE_LISTS.forEach(pl => {
                const opt = document.createElement("option");
                opt.value = String(pl.id);
                opt.textContent = pl.name;
                if (String(pl.id) === String(line.priceListId)) opt.selected = true;
                selectPriceList.appendChild(opt);
              });

              selectPriceList.addEventListener("change", async () => {
                line.priceListId = selectPriceList.value;

                const set = await ensurePriceListProductIds(line.priceListId);

                if (line.productId) {
                  const pid = String(line.productId);
                  if (set && !set.has(pid)) {
                    line.price = 0;
                    line.missingInPriceList = true;
                    recalcLine(line);
                    updateSummary();
                    markDirty();
                    renderLines();
                    return;
                  }
                  await autoUpdatePriceAndRecalc(line);
                }

                markDirty();
              });

              tdPriceList.appendChild(selectPriceList);

              if (line.productId && line.missingInPriceList) {
                const w = document.createElement("span");
                w.className = "warn-icon";
                w.textContent = "!";
                w.title = "Товар отсутствует в выбранном прайс-листе. Укажите цену вручную.";
                tdPriceList.appendChild(w);
              }

              tr.appendChild(tdPriceList);

              const tdPrice = document.createElement("td");
              tdPrice.className = "col-price";
              const inputPrice = document.createElement("input");
              inputPrice.type = "text";
              inputPrice.value = formatMoney(line.price || 0);

              inputPrice.addEventListener("focus", () => {
                const num = Number(line.price) || 0;
                inputPrice.value = num.toString().replace(".", ",");
              });
              inputPrice.addEventListener("input", () => {
                markDirty();
              });

              tdPrice.appendChild(inputPrice);
              tr.appendChild(tdPrice);

              const tdQty = document.createElement("td");
              tdQty.className = "col-qty";
              const qtyWrapper = document.createElement("div");
              qtyWrapper.className = "input-qty-wrapper";
              const inputQty = document.createElement("input");
              inputQty.type = "number";
              inputQty.min = "0";
              inputQty.step = "1";
              inputQty.value = line.quantity;

              const unitSpan = document.createElement("span");
              unitSpan.className = "unit-label";
              unitSpan.textContent = "шт";

              qtyWrapper.appendChild(inputQty);
              qtyWrapper.appendChild(unitSpan);
              tdQty.appendChild(qtyWrapper);
              tr.appendChild(tdQty);

              const tdDiscount = document.createElement("td");
              tdDiscount.className = "col-discount";
              const inputDiscount = document.createElement("input");
              inputDiscount.type = "number";
              inputDiscount.min = "0";
              inputDiscount.max = "100";
              inputDiscount.step = "0.01";
              inputDiscount.value = line.discountPercent.toFixed(2);

              tdDiscount.appendChild(inputDiscount);
              tr.appendChild(tdDiscount);

              const tdVat = document.createElement("td");
              tdVat.className = "col-vat";
              const inputVat = document.createElement("input");
              inputVat.type = "number";
              inputVat.min = "0";
              inputVat.max = "100";
              inputVat.step = "0.1";
              inputVat.value = line.vatPercent;

              tdVat.appendChild(inputVat);
              tr.appendChild(tdVat);

              const tdTotal = document.createElement("td");
              tdTotal.className = "col-total";
              const inputTotal = document.createElement("input");
              inputTotal.type = "text";
              inputTotal.value = formatMoney(line.total);
              inputTotal.style.textAlign = "right";

              tdTotal.appendChild(inputTotal);
              tr.appendChild(tdTotal);

              function syncTotalInput() {
                inputTotal.value = formatMoney(line.total);
              }

              function applyManualTotal(rawValue) {
                let newTotal = toNumberMoney(rawValue);

                if (!isFinite(newTotal) || newTotal < 0) {
                  newTotal = 0;
                }

                const price = Number(line.price) || 0;
                const qty = Number(line.quantity) || 0;
                const vatPercent = Number(line.vatPercent) || 0;
                const base = price * qty;
                const grossMax = base * (1 + vatPercent / 100);

                if (grossMax <= 0) {
                  line.discountPercent = 0;
                  recalcLine(line);
                  updateSummary();
                  markDirty();
                  inputDiscount.value = line.discountPercent.toFixed(2);
                  syncTotalInput();
                  return;
                }

                if (newTotal > grossMax) {
                  newTotal = grossMax;
                }

                let newDiscountPercent = (1 - newTotal / grossMax) * 100;

                if (!isFinite(newDiscountPercent)) {
                  newDiscountPercent = 0;
                }

                line.discountPercent = Math.min(100, Math.max(0, Math.round(newDiscountPercent * 100) / 100));

                recalcLine(line);
                updateSummary();
                markDirty();

                inputDiscount.value = line.discountPercent.toFixed(2);
                syncTotalInput();
              }

              inputTotal.addEventListener("focus", () => {
                inputTotal.value = (Number(line.total) || 0).toFixed(2).replace(".", ",");
                setTimeout(() => {
                  inputTotal.select();
                }, 0);
              });

              inputTotal.addEventListener("input", () => {
                markDirty();
              });

              inputTotal.addEventListener("blur", () => {
                applyManualTotal(inputTotal.value);
              });

              inputTotal.addEventListener("keydown", (e) => {
                if (e.key === "Enter") {
                  e.preventDefault();
                  inputTotal.blur();
                }
              });

              inputPrice.addEventListener("blur", () => {
                let raw = inputPrice.value || "";
                raw = raw.replace(/\s+/g, "").replace(",", ".");
                let num = Number(raw);

                if (isNaN(num)) num = 0;

                line.price = num;
                recalcLine(line);
                updateSummary();
                markDirty();

                inputPrice.value = formatMoney(line.price);
                syncTotalInput();
              });

              inputQty.addEventListener("input", () => {
                line.quantity = Number(inputQty.value) || 0;
                recalcLine(line);
                updateSummary();
                markDirty();
                syncTotalInput();
              });

              inputDiscount.addEventListener("input", () => {
                line.discountPercent = Number(inputDiscount.value) || 0;
                recalcLine(line);
                updateSummary();
                markDirty();
                syncTotalInput();
              });

              inputDiscount.addEventListener("blur", () => {
                line.discountPercent = Math.min(100, Math.max(0, Math.round((Number(inputDiscount.value) || 0) * 100) / 100));
                recalcLine(line);
                updateSummary();
                markDirty();
                inputDiscount.value = line.discountPercent.toFixed(2);
                syncTotalInput();
              });

              inputVat.addEventListener("input", () => {
                line.vatPercent = Number(inputVat.value) || 0;
                recalcLine(line);
                updateSummary();
                markDirty();
                syncTotalInput();
              });

              tbody.appendChild(tr);
            });

            const anySelected = lines.some(l => l.selected);
            const btnDel = document.getElementById("btn-delete-selected");
            if (btnDel) btnDel.disabled = !anySelected;
          }

          // -------------------- INIT APP --------------------
          async function initApp() {
            clearError();
            try {
              await Promise.all([fetchProducts(), fetchPriceLists()]);
              if (lines.length === 0) lines.push(createEmptyLine());
              recalcAll();
              renderLines();
            } catch (e) {
              logEvent("initApp error", { e: String(e) }, "ERROR");
              showError("Ошибка инициализации: " + (e.message || e));
            } finally {
              APP_READY = true;
              loadEntityState();
            }
          }

          // -------------------- DOM READY --------------------
          document.addEventListener("DOMContentLoaded", () => {
            productDropdownEl = document.getElementById("product-dropdown");
            productDropdownListEl = document.getElementById("product-dropdown-list");
            productSearchInputEl = document.getElementById("product-search-input");

            logEvent("DOMContentLoaded start", {
              hasBX24: !!window.BX24,
              href: location.href,
              ctx: CURRENT_CONTEXT
            });

            if (productSearchInputEl) {
              productSearchInputEl.addEventListener("input", () => {
                renderProductDropdownList(productSearchInputEl.value);
              });
            }

            // ===== PRICE MANAGER HOOKS (restored) =====
            const btnManagePrices = document.getElementById("btn-manage-prices");
            if (btnManagePrices) {
              btnManagePrices.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                openPriceManager();
              });
            }

            const pmBtnClose = document.getElementById("pm-btn-close");
            if (pmBtnClose) pmBtnClose.addEventListener("click", () => closePriceManager());

            const pmBtnCancel = document.getElementById("pm-btn-cancel");
            if (pmBtnCancel) pmBtnCancel.addEventListener("click", () => closePriceManager());

            const pmBackdrop = document.getElementById("price-manager-backdrop");
            if (pmBackdrop) {
              pmBackdrop.addEventListener("click", (e) => {
                if (e.target === pmBackdrop) closePriceManager();
              });
            }

            // modal maximize
            const pmBtnMax = document.getElementById("pm-btn-maximize");
            if (pmBtnMax) {
              pmBtnMax.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                setPriceManagerFullscreen(!pmIsFullscreen);
              });
            }

            // items maximize
            const pmItemsBtnMax = document.getElementById("pm-items-btn-maximize");
            if (pmItemsBtnMax) {
              pmItemsBtnMax.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                setPmItemsFullscreen(!pmItemsIsFullscreen);
              });
            }

            // pm sidebar search
            const pmSearch = document.getElementById("pm-search-input");
            if (pmSearch) {
              pmSearch.addEventListener("input", () => {
                pmSearchTerm = pmSearch.value || "";
                renderPriceListsSidebar();
              });
            }

            // pm items search
            const pmItemsSearch = document.getElementById("pm-items-search");
            if (pmItemsSearch) {
              pmItemsSearch.addEventListener("input", () => {
                pmItemsSearchTerm = pmItemsSearch.value || "";
                renderPriceItemsTable();
              });
            }

            // pm buttons
            const pmBtnNew = document.getElementById("pm-btn-new");
            if (pmBtnNew) pmBtnNew.addEventListener("click", pmCreateNew);

            const pmBtnCopy = document.getElementById("pm-btn-copy");
            if (pmBtnCopy) pmBtnCopy.addEventListener("click", pmCopySelected);

            const pmBtnDelete = document.getElementById("pm-btn-delete");
            if (pmBtnDelete) pmBtnDelete.addEventListener("click", pmDeleteSelected);

            const pmBtnDefault = document.getElementById("pm-btn-default");
            if (pmBtnDefault) pmBtnDefault.addEventListener("click", pmMakeDefault);

            const pmBtnSave = document.getElementById("pm-btn-save");
            if (pmBtnSave) pmBtnSave.addEventListener("click", pmSaveAll);

            // items: add/delete selected
            const pmItemsAddBtn = document.getElementById("pm-items-btn-add");
            if (pmItemsAddBtn) {
              pmItemsAddBtn.addEventListener("click", (e) => {
                e.preventDefault();
                e.stopPropagation();
                openProductDropdownForPmAdd(pmItemsAddBtn);
              });
            }

            const pmItemsDelSel = document.getElementById("pm-items-btn-del-selected");
            if (pmItemsDelSel) {
              pmItemsDelSel.addEventListener("click", () => {
                pmDeleteSelectedItems();
              });
            }

            // pm inputs mark dirty (old behavior)
            const pmNameEl = document.getElementById("pm-input-name");
            if (pmNameEl) pmNameEl.addEventListener("input", () => { pmItemsDirty = true; });

            const pmDescEl = document.getElementById("pm-input-description");
            if (pmDescEl) pmDescEl.addEventListener("input", () => { pmItemsDirty = true; });

            // ESC — close modal or dropdown
            document.addEventListener("keydown", (e) => {
              if (e.key === "Escape") {
                if (isDropdownOpen()) {
                  closeProductDropdown();
                  return;
                }
                const b = document.getElementById("price-manager-backdrop");
                if (b && b.classList.contains("visible")) {
                  closePriceManager();
                }
              }
            });

            // click outside closes dropdown (and persistent toast)
            document.addEventListener("click", (e) => {
              const toast = document.querySelector(".toast.persistent");
              if (toast) {
                toast.classList.remove("visible");
                setTimeout(() => toast.remove(), 200);
              }

              if (!productDropdownEl) return;
              if (!productDropdownEl.classList.contains("visible")) return;

              const clickedOnLineInput = (currentProductInput && e.target === currentProductInput);
              const clickedOnPmAddBtn = (pmAddAnchorEl && (e.target === pmAddAnchorEl || pmAddAnchorEl.contains(e.target)));

              if (!productDropdownEl.contains(e.target) && !clickedOnLineInput && !clickedOnPmAddBtn) {
                closeProductDropdown();
              }
            });

            // Main buttons
            const btnAdd = document.getElementById("btn-add-row");
            if (btnAdd) {
              btnAdd.addEventListener("click", () => {
                const line = createEmptyLine();
                lines.push(line);
                markDirty();
                recalcAll();
                renderLines();
              });
            }

            const btnDeleteSelected = document.getElementById("btn-delete-selected");
            if (btnDeleteSelected) {
              btnDeleteSelected.addEventListener("click", () => {
                lines = lines.filter(l => !l.selected);
                if (lines.length === 0) lines.push(createEmptyLine());
                markDirty();
                recalcAll();
                renderLines();
              });
            }

            const btnRecalcSelected = document.getElementById("btn-recalc-selected");
            if (btnRecalcSelected) {
              btnRecalcSelected.addEventListener("click", async () => {
                for (const line of lines) {
                  if (!line.selected) continue;
                  await fetchPriceForLine(line);
                  recalcLine(line);
                }
                updateSummary();
                renderLines();
              });
            }

            const btnGenerateDoc = document.getElementById("btn-generate-doc");
            if (btnGenerateDoc) btnGenerateDoc.addEventListener("click", generateDocument);

            const btnSave = document.getElementById("btn-save");
            if (btnSave) btnSave.addEventListener("click", saveCurrentEntityState);

            const btnCancel = document.getElementById("btn-cancel");
            if (btnCancel) {
              btnCancel.addEventListener("click", async () => {
                try {
                  // Показываем подтверждение, если есть несохранённые изменения
                  if (hasUnsavedChanges) {
                    if (!confirm("Есть несохранённые изменения. Отменить все действия?")) {
                      return;
                    }
                  }

                  // Загружаем состояние из поля в сделке/предложении
                  if (CURRENT_CONTEXT.id && CURRENT_CONTEXT.mode) {
                    showToast("Загрузка сохранённого состояния...", "success", true);

                    // Загружаем состояние из Bitrix24
                    loadEntityState();

                    showToast("Состояние восстановлено", "success");
                  } else {
                    // Если нет контекста, просто очищаем строки
                    lines = [createEmptyLine()];
                    recalcAll();
                    renderLines();
                    markSaved();
                    showToast("Создана новая строка", "success");
                  }
                } catch (e) {
                  showToast("Ошибка при отмене: " + e.message, "error");
                }
              });
            }

            // Кнопка синхронизации товаров
            const btnSyncProducts = document.getElementById("btn-sync-products");
            if (btnSyncProducts) {
              btnSyncProducts.addEventListener("click", syncProducts);
            }

            document.addEventListener("visibilitychange", () => {
              if (!document.hidden) {
                // При возвращении на вкладку
                if (!hasUnsavedChanges) {
                  loadEntityState();
                } else {
                  showToast("Есть несохранённые изменения. Нажмите «Сохранить», чтобы не потерять их.", "error", true);
                }
              } else {
                // При уходе со вкладки
                if (suppressUnsavedToast) return;
                if (hasUnsavedChanges) {
                  showToast("Есть несохранённые изменения. Если уйдёте — они могут не сохраниться.", "error", true);
                }
              }
            });

            setInterval(() => {
              if (!CURRENT_CONTEXT.id || !CURRENT_CONTEXT.mode) return;
              if (hasUnsavedChanges) return;
              loadEntityState();
            }, 15000);

            window.addEventListener("error", (e) => {
              try {
                const info = {
                  message: e.message,
                  source: e.filename,
                  line: e.lineno,
                  col: e.colno,
                  stack: e.error && e.error.stack ? String(e.error.stack) : null
                };
                logEvent("window.error", info, "ERROR");
              } catch (_) { }
            });

            window.addEventListener("unhandledrejection", (e) => {
              try {
                const reason = e.reason;
                logEvent("unhandledrejection", {
                  reason: (reason && reason.message) ? reason.message : String(reason),
                  stack: reason && reason.stack ? String(reason.stack) : null
                }, "ERROR");
              } catch (_) { }
            });

            window.addEventListener("beforeunload", (e) => {
              if (!hasUnsavedChanges && !pmItemsDirty) return;
              e.preventDefault();
              e.returnValue = "";
            });

            window.addEventListener("blur", () => {
              if (suppressUnsavedToast) return;
              if (hasUnsavedChanges) showToast("Есть несохранённые изменения — не забудьте сохранить.", "error", true);
            });

            const cbSelectAll = document.getElementById("cb-select-all");
            if (cbSelectAll) {
              cbSelectAll.addEventListener("change", () => {
                const checked = cbSelectAll.checked;
                lines.forEach(l => { l.selected = checked; });
                recalcAll();
                renderLines();
              });
            }

            (function () {
              function setAppHeight() {
                document.documentElement.style.setProperty('--appH', window.innerHeight + 'px');
              }
              window.addEventListener('resize', () => {
                setAppHeight();

                // keep modal visible inside viewport on resize
                const { dialog } = getPmEls();
                const backdrop = document.getElementById("price-manager-backdrop");
                if (backdrop && backdrop.classList.contains("visible") && dialog) {
                  if (pmIsFullscreen) setPriceManagerFullscreen(true);
                  else {
                    const rect = clampRect(readRectFromDialog(dialog));
                    applyRectToDialog(dialog, rect);
                    savePmRect(rect);
                  }
                }

              }, { passive: true });

              window.addEventListener('orientationchange', setAppHeight, { passive: true });
              setAppHeight();
            })();

            // GO
            initApp();
            initBitrixContextUnified();
          });

          // ==================== RESIZABLE COLUMNS ====================
          (function initResizableColumns() {
            const table = document.querySelector(".products-table-wrapper table");
            if (!table) return;

            const thead = table.querySelector("thead");
            const headerRow = thead && thead.querySelector("tr");
            if (!headerRow) return;

            const ths = Array.from(headerRow.children).filter(el => el.tagName === "TH");
            if (ths.length === 0) return;

            let colgroup = table.querySelector("colgroup");
            if (!colgroup) {
              colgroup = document.createElement("colgroup");
              for (let i = 0; i < ths.length; i++) colgroup.appendChild(document.createElement("col"));
              table.insertBefore(colgroup, table.firstChild);
            }

            const cols = Array.from(colgroup.querySelectorAll("col"));
            if (cols.length !== ths.length) {
              colgroup.innerHTML = "";
              for (let i = 0; i < ths.length; i++) colgroup.appendChild(document.createElement("col"));
            }

            const cols2 = Array.from(colgroup.querySelectorAll("col"));
            const STORAGE_KEY = "prices_widget_main_table_col_widths_v1";

            function getInitialWidths() {
              return ths.map(th => Math.max(40, Math.round(th.getBoundingClientRect().width)));
            }

            function applyWidths(widths) {
              widths.forEach((w, idx) => {
                const widthPx = Math.max(34, Number(w) || 0);
                cols2[idx].style.width = widthPx + "px";
                ths[idx].style.width = widthPx + "px";
              });
            }

            function loadWidths() {
              try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (!raw) return null;
                const arr = JSON.parse(raw);
                if (!Array.isArray(arr) || arr.length !== ths.length) return null;
                return arr.map(x => Math.max(34, Number(x) || 0));
              } catch (e) { return null; }
            }

            function saveWidths(widths) {
              try { localStorage.setItem(STORAGE_KEY, JSON.stringify(widths)); } catch (e) { }
            }

            const saved = loadWidths();
            if (saved) applyWidths(saved);
            else {
              const init = getInitialWidths();
              applyWidths(init);
              saveWidths(init);
            }

            ths.forEach((th, index) => {
              if (th.querySelector(".th-resizer")) return;

              const resizer = document.createElement("span");
              resizer.className = "th-resizer";
              th.appendChild(resizer);

              let startX = 0;
              let startW = 0;
              let widthsSnapshot = null;

              function onMouseMove(e) {
                const dx = e.clientX - startX;
                const newW = Math.max(34, startW + dx);

                widthsSnapshot[index] = newW;
                applyWidths(widthsSnapshot);
              }

              function onMouseUp() {
                document.body.classList.remove("col-resize-active");
                document.removeEventListener("mousemove", onMouseMove);
                document.removeEventListener("mouseup", onMouseUp);
                saveWidths(widthsSnapshot);
              }

              resizer.addEventListener("mousedown", (e) => {
                e.preventDefault();
                e.stopPropagation();

                document.body.classList.add("col-resize-active");
                startX = e.clientX;

                widthsSnapshot = cols2.map((col, i) => {
                  const w = parseInt(col.style.width, 10);
                  if (Number.isFinite(w) && w > 0) return w;
                  return Math.max(34, Math.round(ths[i].getBoundingClientRect().width));
                });

                startW = widthsSnapshot[index];

                document.addEventListener("mousemove", onMouseMove);
                document.addEventListener("mouseup", onMouseUp);
              });
            });
          })();

        })();

        // -------------------- RESIZABLE TABLE --------------------
        (function initResizableTable() {
          const tableContainer = document.getElementById('table-container');
          if (!tableContainer) return;

          let startY = 0;
          let startHeight = 0;
          let resizing = false;

          function onMouseMove(e) {
            if (!resizing) return;

            const dy = e.clientY - startY;
            const newHeight = Math.max(150, startHeight + dy);
            const maxHeight = window.innerHeight - 300; // немного уменьшил запас

            tableContainer.style.height = Math.min(newHeight, maxHeight) + 'px';
            tableContainer.classList.add('resizing');
          }

          function onMouseUp() {
            if (!resizing) return;
            resizing = false;
            tableContainer.classList.remove('resizing');
            document.removeEventListener('mousemove', onMouseMove);
            document.removeEventListener('mouseup', onMouseUp);
            document.body.style.cursor = '';

            try {
              localStorage.setItem('table_height', tableContainer.style.height);
            } catch (e) { }
          }

          tableContainer.addEventListener('mousedown', (e) => {
            const rect = tableContainer.getBoundingClientRect();
            const isNearBottom = e.clientY > rect.bottom - 10;

            if (isNearBottom) {
              e.preventDefault();
              resizing = true;
              startY = e.clientY;
              startHeight = tableContainer.offsetHeight;

              document.addEventListener('mousemove', onMouseMove);
              document.addEventListener('mouseup', onMouseUp);
              document.body.style.cursor = 'ns-resize';
            }
          });

          // Восстанавливаем сохранённую высоту
          try {
            const savedHeight = localStorage.getItem('table_height');
            if (savedHeight) {
              const h = parseInt(savedHeight);
              if (h >= 150) tableContainer.style.height = savedHeight;
            }
          } catch (e) { }
        })();
      </script>
</body>
