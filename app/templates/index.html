<!doctype html>
<html lang="ru">

<head>
  <meta charset="utf-8">
  <title>Прайс-листы CRM</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <script src="//api.bitrix24.com/api/v1/"></script>

  <style>
    :root {
      --bx-blue: #3bc8f5;
      --bx-blue-dark: #0bb1e5;
      --bx-green: #bbed21;
      --bx-green-dark: #9ad215;
      --bx-border: #dce0e4;
      --bx-bg: #f5f7f9;
      --bx-text: #333;
      --bx-muted: #888;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 12px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
      background: var(--bx-bg);
      color: var(--bx-text);
      height: 100vh;
      overflow: hidden;
    }

    /* ===== MODAL STYLES ===== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(9, 16, 29, 0.45);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
    }

    .modal-backdrop.visible {
      display: flex;
    }

    .modal-dialog {
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
      min-width: 600px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--bx-border);
      position: absolute;
      max-height: calc(100vh - 40px);
    }

    .modal-header {
      padding: 10px 14px;
      border-bottom: 1px solid #e1e6ec;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: move;
    }

    .modal-title {
      font-size: 14px;
      font-weight: 600;
    }

    .modal-close-btn {
      border: none;
      background: transparent;
      font-size: 16px;
      cursor: pointer;
      line-height: 1;
      padding: 0;
      color: #999;
    }

    .modal-close-btn:hover {
      color: #555;
    }

    .modal-action-btn {
      border: none;
      background: transparent;
      font-size: 14px;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
      color: #999;
    }

    .modal-action-btn:hover {
      color: #333;
    }

    .modal-body {
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr);
      gap: 12px;
      overflow: hidden;
      flex: 1 1 auto;
      min-height: 0;
    }

    .modal-footer {
      display: block;
      align-items: center;
      padding: 6px 10px;
      border-top: 1px solid #e1e6ec;
      gap: 8px;
    }

    .modal-footer-spacer {
      flex: 1 1 auto;
    }

    .modal-footer-actions {
      display: flex;
      gap: 8px;
    }

    .modal-footer .btn {
      padding: 6px 10px;
      line-height: 1.1;
    }

    .modal-resize-handle {
      position: absolute;
      z-index: 10;
    }

    .resize-right {
      top: 8px;
      right: 0;
      width: 8px;
      height: calc(100% - 16px);
      cursor: ew-resize;
    }

    .resize-left {
      top: 8px;
      left: 0;
      width: 8px;
      height: calc(100% - 16px);
      cursor: ew-resize;
    }

    .resize-top {
      top: 0;
      left: 8px;
      width: calc(100% - 16px);
      height: 8px;
      cursor: ns-resize;
    }

    .resize-bottom {
      bottom: 0;
      left: 8px;
      width: calc(100% - 16px);
      height: 8px;
      cursor: ns-resize;
    }

    .resize-corner-rt,
    .resize-corner-rb,
    .resize-corner-lt,
    .resize-corner-lb {
      width: 12px;
      height: 12px;
    }

    .resize-corner-rt {
      top: 0;
      right: 0;
      cursor: ne-resize;
    }

    .resize-corner-rb {
      bottom: 0;
      right: 0;
      cursor: nwse-resize;
    }

    .resize-corner-lt {
      top: 0;
      left: 0;
      cursor: nw-resize;
    }

    .resize-corner-lb {
      bottom: 0;
      left: 0;
      cursor: nesw-resize;
    }

    /* ===== PRICE MANAGER STYLES ===== */
    .price-list-sidebar {
      border: 1px solid #e3e7ee;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fafbfe;
    }

    .price-list-sidebar-header {
      padding: 8px 10px;
      background: #f4f7fb;
      border-bottom: 1px solid #e3e7ee;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .price-list-search {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid #c5ced8;
      background: #fff;
    }

    .price-list-search:focus {
      border-color: var(--bx-blue-dark);
      box-shadow: 0 0 0 2px rgba(59, 200, 245, 0.2);
    }

    .price-list-sidebar-list {
      flex: 1;
      overflow: auto;
      padding: 4px 0;
    }

    .price-list-item {
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .price-list-item-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .price-list-item-count {
      margin-left: 8px;
      font-size: 11px;
      color: var(--bx-muted);
      white-space: nowrap;
    }

    .price-list-item:hover {
      background: #f0f6ff;
    }

    .price-list-item.active {
      background: #e2f3ff;
    }

    .price-list-form {
      border: 1px solid #e3e7ee;
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fafbfe;
    }

    .price-list-actions {
      display: flex;
      gap: 8px;
      margin-bottom: 4px;
    }

    .price-list-form-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .price-list-form-row label {
      font-size: 12px;
      color: #666;
    }

    .price-list-form-row input[type="text"],
    .price-list-form-row textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 6px 8px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #c5ced8;
      background: #fff;
      outline: none;
      resize: vertical;
      min-height: 32px;
    }

    .price-list-form-row textarea {
      min-height: 60px;
    }

    .price-list-form-row input:focus,
    .price-list-form-row textarea:focus {
      border-color: var(--bx-blue-dark);
      box-shadow: 0 0 0 2px rgba(59, 200, 245, 0.2);
    }

    .price-list-form-meta {
      font-size: 12px;
      color: var(--bx-muted);
    }

    .price-items-wrapper {
      border: 1px solid #e3e7ee;
      border-radius: 6px;
      background: #fff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1 1 auto;
      min-height: 0;
    }

    .price-items-header {
      padding: 6px 8px;
      background: #f4f7fb;
      border-bottom: 1px solid #e3e7ee;
      font-size: 12px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .price-items-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
    }

    .pm-items-search {
      font-size: 14px;
      padding: 4px 6px;
      border: 1px solid #c5ced8;
      border-radius: 4px;
      width: 120px;
    }

    #pm-items-btn-add {
      padding: 4px 8px;
      height: 28px;
    }

    .pm-items-fs-btn {
      margin-left: auto;
    }

    .price-items-table-container {
      overflow: auto;
      padding-bottom: 16px;
      flex: 1 1 auto;
      min-height: 0;
    }

    .price-items-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      table-layout: fixed;
    }

    .price-items-table td:nth-child(2) {
      width: 60px;
      min-width: 60px;
    }

    .price-items-table tbody tr:nth-child(even) {
      background: #fbfcfe;
    }

    .price-item-price-input {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid #c5ced8;
    }

    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      background: #2fba4a;
      color: #fff;
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.18);
      z-index: 11000;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .toast.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .toast-icon {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
    }

    .toast-text {
      line-height: 1.4;
    }

    .toast-error {
      background: #ff726c;
    }

    /* ===== ОСНОВНОЙ ЛЕЙАУТ ===== */
    .app-root {
      max-width: 1200px;
      margin: 0 auto;
      background: #fff;
      border-radius: 8px;
      border: 1px solid var(--bx-border);
      box-shadow: 0 1px 3px rgba(15, 35, 52, 0.08);
      padding: 16px;
      height: calc(100vh - 24px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Верхняя панель */
    .toolbar-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .toolbar-top-left,
    .toolbar-top-right {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* Кнопки */
    .btn {
      padding: 6px 12px;
      border-radius: 4px;
      border: 1px solid var(--bx-border);
      background: #fff;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
      transition: background 0.15s, box-shadow 0.15s, transform 0.05s;
    }

    .btn-light {
      background: #f5f5f5;
      border-color: #dcdcdc;
    }

    .btn-icon-sync {
      padding: 6px 8px;
      min-width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
    }

    .btn-icon-sync:active {
      transform: translateY(1px);
    }

    .btn:hover:not(:disabled) {
      background: #f3f6fb;
    }

    .btn:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.12);
    }

    .btn-primary {
      background: var(--bx-blue);
      border-color: var(--bx-blue-dark);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--bx-blue-dark);
    }

    .btn-danger {
      background: #ff726c;
      border-color: #ff5b54;
      color: #fff;
    }

    .btn-danger:hover:not(:disabled) {
      background: #ff5b54;
    }

    .btn-success {
      background: var(--bx-green);
      border-color: var(--bx-green-dark);
      color: #000;
      font-weight: 600;
    }

    .btn-success:hover:not(:disabled) {
      background: var(--bx-green-dark);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .tag {
      padding: 3px 8px;
      border-radius: 999px;
      background: #eef2f5;
      font-size: 11px;
      color: var(--bx-muted);
    }

    .error-banner {
      background: #ffe8e6;
      border: 1px solid #ffb4aa;
      color: #9b1c1c;
      padding: 6px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      font-size: 12px;
      display: none;
    }

    /* ===== ТАБЛИЦА С РЕСАЙЗОМ ===== */
    .table-container {
      width: 100%;
      border: 1px solid var(--bx-border);
      border-radius: 6px;
      margin-bottom: 16px;
      resize: vertical;
      min-height: 150px;
      max-height: 60vh;
      overflow: auto;
      background: #fff;
      position: relative;
    }

    .products-table-wrapper {
      min-width: min-content;
      height: 100%;
    }

    .products-table-wrapper table {
      border-collapse: collapse;
      font-size: 13px;
      table-layout: auto;
      width: 100%;
    }

    thead {
      background: #f4f7fb;
      position: sticky;
      top: 0;
      z-index: 2;
    }

    th,
    td {
      padding: 6px 8px;
      border-bottom: 1px solid #eef1f4;
      text-align: left;
      white-space: nowrap;
      vertical-align: middle;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    th {
      font-weight: 600;
      color: #555;
    }

    tbody tr:nth-child(even) {
      background: #fbfcfe;
    }

    tbody tr.selected {
      background: #e6f4ff;
    }

    /* ===== КОМПАКТНЫЕ КОЛОНКИ ===== */
    .col-index {
      width: 30px;
      min-width: 30px;
      max-width: 30px;
      text-align: right;
      color: var(--bx-muted);
      padding: 6px 4px;
    }

    .col-checkbox {
      width: 30px;
      min-width: 30px;
      max-width: 30px;
      text-align: center;
      padding: 6px 4px;
    }

    .col-product {
      width: 180px;
      min-width: 160px;
      max-width: 200px;
      white-space: normal;
      word-break: break-word;
    }

    .col-price-list {
      width: 110px;
      min-width: 100px;
      max-width: 120px;
    }

    .col-price {
      width: 80px;
      min-width: 70px;
      max-width: 90px;
    }

    .col-qty {
      width: 60px;
      min-width: 55px;
      max-width: 70px;
    }

    .col-discount {
      width: 60px;
      min-width: 55px;
      max-width: 70px;
    }

    .col-vat {
      width: 50px;
      min-width: 45px;
      max-width: 60px;
    }

    .col-total {
      width: 90px;
      min-width: 80px;
      max-width: 100px;
    }

    input[type="checkbox"] {
      transform: scale(1.1);
      cursor: pointer;
      margin: 0;
    }

    select,
    input[type="number"],
    input[type="text"] {
      width: 100%;
      box-sizing: border-box;
      padding: 4px 6px;
      font-size: 12px;
      border-radius: 4px;
      border: 1px solid #c5ced8;
      background: #fff;
      outline: none;
      height: 28px;
    }

    select:focus,
    input[type="number"]:focus,
    input[type="text"]:focus {
      border-color: var(--bx-blue-dark);
      box-shadow: 0 0 0 2px rgba(59, 200, 245, 0.2);
    }

    .input-qty-wrapper {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .input-qty-wrapper input {
      width: 45px;
    }

    .unit-label {
      font-size: 11px;
      color: var(--bx-muted);
      white-space: nowrap;
    }

    /* ===== БЛОК СУММ ===== */
    .summary-card {
      border: 1px solid var(--bx-border);
      border-radius: 6px;
      padding: 10px 12px;
      background: #fafbfc;
      font-size: 13px;
      flex-shrink: 0;
      margin-bottom: 16px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
      color: #555;
    }

    .summary-row.total {
      font-weight: 600;
      border-top: 1px solid #dde2ea;
      padding-top: 6px;
      margin-top: 6px;
      color: #000;
    }

    .summary-label {
      margin-right: 12px;
    }

    .summary-value {
      text-align: right;
      font-weight: 500;
    }

    /* ===== НИЖНЯЯ ПАНЕЛЬ ===== */
    .footer-buttons {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      margin-bottom: 16px;
    }

    .footer-left,
    .footer-right {
      display: flex;
      gap: 8px;
    }

    /* ===== ПАНЕЛЬ ДОКУМЕНТОВ ===== */
    .docs-panel {
      border: 1px solid var(--bx-border);
      border-radius: 6px;
      padding: 10px 12px;
      background: #fafbfc;
      font-size: 13px;
      flex-shrink: 0;
    }

    .docs-panel-title {
      font-weight: 600;
      margin-bottom: 6px;
    }

    .docs-variants {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 8px;
    }

    .docs-variant {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 4px;
      cursor: pointer;
    }

    .docs-variant:hover {
      background: #f0f4ff;
    }

    .docs-variant input[type="radio"] {
      margin: 0;
    }

    .docs-variant-label-main {
      font-weight: 500;
    }

    .docs-variant-label-sub {
      font-size: 11px;
      color: var(--bx-muted);
    }

    /* ===== ПРОЧИЕ СТИЛИ ===== */
    .warn-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 6px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      font-size: 12px;
      line-height: 1;
      cursor: help;
    }

    .product-dropdown {
      position: fixed;
      z-index: 20000;
      background: #fff;
      border-radius: 4px;
      border: 1px solid #c5ced8;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      max-height: calc(100vh - 200px);
      min-width: 280px;
      display: none;
      overflow: hidden;
      font-size: 13px;
    }

    .product-dropdown.visible {
      display: block;
    }

    .product-dropdown-search {
      padding: 6px 8px;
      border-bottom: 1px solid #eef1f4;
      background: #fafbff;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .product-dropdown-search input {
      width: 100%;
      padding: 4px 6px;
      font-size: 13px;
      border-radius: 4px;
      border: 1px solid #c5ced8;
    }

    .product-dropdown-list {
      max-height: calc(100vh - 240px);
      overflow-y: auto;
    }

    .product-row {
      padding: 6px 8px;
      border-bottom: 1px solid #f1f3f6;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .product-row:hover {
      background: #f3f7ff;
    }

    .product-row-name {
      font-size: 13px;
    }

    .product-row-meta {
      font-size: 11px;
      color: var(--bx-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .product-row.not-in-price {
      opacity: 0.6;
    }

    .product-row.not-in-price .product-row-name::after {
      content: " • нет в прайсе";
      font-size: 11px;
      color: #ff5b54;
    }

    /* ===== RESIZABLE COLUMNS ===== */
    .table-container thead th {
      position: relative;
      user-select: none;
    }

    .th-resizer {
      position: absolute;
      top: 0;
      right: -2px;
      width: 6px;
      height: 100%;
      cursor: col-resize;
      z-index: 5;
    }

    .th-resizer:hover::after {
      content: "";
      position: absolute;
      top: 0;
      left: 2px;
      width: 2px;
      height: 100%;
      background: rgba(11, 177, 229, 0.6);
    }

    body.col-resize-active {
      cursor: col-resize !important;
      user-select: none !important;
    }

    /* Индикатор ресайза для таблицы */
    .table-container::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(180deg, transparent, rgba(59, 200, 245, 0.2));
      cursor: ns-resize;
      opacity: 0;
      transition: opacity 0.2s;
      pointer-events: none;
      z-index: 10;
    }

    .table-container:hover::after {
      opacity: 1;
    }

    .table-container.resizing::after {
      background: linear-gradient(180deg, transparent, var(--bx-blue));
      opacity: 1;
      height: 8px;
    }

    /* Скрываем старый right-block */
    .right-block {
      display: none !important;
    }

    /* Адаптивность */
    @media (max-width: 1100px) {
      .col-product {
        width: 160px;
      }

      .col-price-list {
        width: 100px;
      }
    }

    @media (max-width: 900px) {
      .app-root {
        padding: 12px;
      }

      .col-product {
        width: 140px;
      }

      .col-price-list {
        width: 90px;
      }
    }

    .app-root {
      overflow-y: auto !important;
      height: calc(100vh - 24px);
      padding-bottom: 20px;
    }

    .table-container {

      <script>
        /**
         * Prices Widget — FIXED for Bitrix24:
         * - Deals: crm.deal.get / crm.deal.update (entityTypeId=2)
         * - Quotes (Classic quote entityTypeId=7): crm.item.get / crm.item.update (camelCase fields)
         *
         * ✅ Quote fields (camelCase):
         *   - opportunity
         *   - currencyId
         *   - ufCrm_QUOTE_1769692749969   (state)
         *   - ufCrm_QUOTE_1769693197444   (default price list)
         *
         * Logging:
         * - console
         * - localStorage ring buffer
         * - optional backend log endpoint: POST /api/logs (if you implement it)
         */

        (function ensureBx24Sdk() {
          if (window.BX24) return;

          const s = document.createElement("script");
          s.src = "https://api.bitrix24.com/api/v1/";
          s.async = true;
          s.onload = () => {
            console.log("BX24 SDK loaded");
            try { logEvent("BX24 SDK loaded"); } catch (e) { }
          };
          s.onerror = () => {
            console.warn("BX24 SDK failed to load");
          };
          document.head.appendChild(s);
        })();

        (function () {
          // -------------------- GLOBALS --------------------
          let PRODUCTS = [];
          let PRICE_LISTS = [];
          let lines = [];
          let APP_READY = false;
          let hasUnsavedChanges = false;
          let suppressUnsavedToast = false;

          const VAT_RATES = [0, 5, 10, 20];

          // If your frontend is on same domain as backend, keep "".
          // Otherwise set "https://your-backend-domain"
          const apiBase = "";

          // Local keys
          const DEFAULT_PRICE_LIST_KEY = "prices_widget_default_price_list_id";
          const PRICE_LIST_PRODUCT_IDS_CACHE = new Map();

          // DEAL custom field where we store widget JSON state
          const DEAL_STATE_FIELD = "UF_CRM_1764667329";

          // QUOTE custom field where we store widget JSON state (camelCase key!)
          const QUOTE_STATE_FIELD = "ufCrm_QUOTE_1769692749969";

          // Quote default price list field (camelCase key!)
          const QUOTE_DEFAULT_PRICE_LIST_FIELD = "ufCrm_QUOTE_1769693197444";

          // Quote money/currency keys (camelCase)
          const QUOTE_CURRENCY_FIELD = "currencyId";
          const QUOTE_OPPORTUNITY_FIELD = "opportunity";

          // Deal money/currency keys (Bitrix classic deal update fields)
          const DEAL_OPPORTUNITY_FIELD = "OPPORTUNITY";

          // Context
          const CURRENT_CONTEXT = {
            mode: null,   // "DEAL" | "QUOTE"
            id: null,
            entityTypeId: null
          };

          // localStorage prefixes per entity
          const LOCAL_STATE_PREFIX_DEAL = "prices_widget_state_deal_";
          const LOCAL_STATE_PREFIX_QUOTE = "prices_widget_state_quote_";

          let LAST_REMOTE_STATE_RAW = null;
          let REMOTE_STATE_LOADED = false;
          let LOCAL_EDIT_VERSION = 0;
          let ENTITY_LOAD_SEQ = 0;

          // for compatibility in docs generation
          let CURRENT_DEAL_ID = null;

          // Dropdown
          let currentProductInput = null;
          let currentProductLine = null;
          let productDropdownEl = null;
          let productDropdownListEl = null;
          let productSearchInputEl = null;
          let productDropdownMode = "line";
          let pmAddAnchorEl = null;
          let dropdownAnchorEl = null;
          let dropdownScrollParents = [];
          let dropdownRaf = 0;

          // -------------------- LOGGING --------------------
          const LOG_KEY = "prices_widget_debug_log_v2";
          const LOG_MAX = 800;

          function errToText(err) {
            try {
              if (!err) return "unknown error";
              if (typeof err === "string") return err;
              if (err.error_description) return err.error_description;
              if (err.error) return err.error;
              if (err.message) return err.message;
              return JSON.stringify(err);
            } catch (e) {
              return String(err);
            }
          }

          function safeJsonStringify(obj) {
            try { return JSON.stringify(obj); } catch (e) { return '"[unserializable]"'; }
          }

          const LOG_BACKEND_URL = ""; // "" = off, or "/api/logs" if you add endpoint

          async function sendLogToBackend(level, message, data) {
            if (!LOG_BACKEND_URL) return;
            try {
              await fetch(apiBase + LOG_BACKEND_URL, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ level, message, data, ctx: CURRENT_CONTEXT })
              });
            } catch (e) { }
          }

          function logEvent(message, data, level = "INFO") {
            const line =
              `[${new Date().toISOString()}] [${level}] ${message}` +
              (data ? ` | ${safeJsonStringify(data)}` : "");

            console.log(line);

            try {
              const prev = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");
              prev.push(line);
              localStorage.setItem(LOG_KEY, JSON.stringify(prev.slice(-LOG_MAX)));
            } catch (e) { }

            sendLogToBackend(level, message, data);
          }

          window.__pricesWidgetDumpLog = function () {
            try {
              const arr = JSON.parse(localStorage.getItem(LOG_KEY) || "[]");
              console.log("=== prices widget log dump ===");
              arr.forEach(x => console.log(x));
              console.log("=== end ===");
            } catch (e) {
              console.log("no log");
            }
          };

          // -------------------- UI HELPERS --------------------
          function showError(message) {
            const banner = document.getElementById("error-banner");
            if (!banner) return;
            banner.textContent = message;
            banner.style.display = "block";
          }

          function clearError() {
            const banner = document.getElementById("error-banner");
            if (!banner) return;
            banner.textContent = "";
            banner.style.display = "none";
          }

          function showToast(message, type = "success", persistent = false) {
            const container = document.getElementById("toast-container");
            if (!container) return;

            if (persistent && container.querySelector(".toast.persistent")) return;

            const toast = document.createElement("div");
            toast.className = "toast";
            if (type !== "success") toast.classList.add("toast-error");
            if (persistent) toast.classList.add("persistent");

            const icon = document.createElement("div");
            icon.className = "toast-icon";
            icon.textContent = (type === "success") ? "✓" : "!";

            const text = document.createElement("div");
            text.className = "toast-text";
            text.textContent = message;

            toast.appendChild(icon);
            toast.appendChild(text);
            container.appendChild(toast);

            setTimeout(() => toast.classList.add("visible"), 10);

            if (!persistent) {
              setTimeout(() => {
                toast.classList.remove("visible");
                setTimeout(() => toast.remove(), 200);
              }, 2500);
            }
          }

          function markDirty() {
            hasUnsavedChanges = true;
            LOCAL_EDIT_VERSION += 1;

            const toast = document.querySelector(".toast.persistent");
            if (toast) {
              toast.classList.remove("visible");
              setTimeout(() => toast.remove(), 200);
            }
          }

          function markSaved() {
            hasUnsavedChanges = false;
          }

          function confirmNoUnsavedToast(message) {
            suppressUnsavedToast = true;
            try {
              return window.confirm(message);
            } finally {
              setTimeout(() => { suppressUnsavedToast = false; }, 0);
            }
          }

          // -------------------- MONEY --------------------
          function toNumberMoney(v) {
            if (v == null) return 0;
            if (typeof v === "number") return isFinite(v) ? v : 0;
            if (typeof v === "string") {
              const s = v.trim().replace(/\s+/g, "").replace(",", ".");
              const n = Number(s);
              return isNaN(n) ? 0 : n;
            }
            return 0;
          }

          function formatMoney(value) {
            let num = toNumberMoney(value);
            num = num.toFixed(2);
            let parts = num.split(".");
            let intPart = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
            let decPart = parts[1];
            return `${intPart},${decPart}`;
          }

          // -------------------- LINES --------------------
          function getDefaultPriceListId() {
            try {
              return window.localStorage ? window.localStorage.getItem(DEFAULT_PRICE_LIST_KEY) : null;
            } catch (e) { return null; }
          }

          function setDefaultPriceListId(id) {
            try {
              if (window.localStorage) window.localStorage.setItem(DEFAULT_PRICE_LIST_KEY, String(id));
            } catch (e) { }
          }

          function createEmptyLine() {
            return {
              id: Date.now().toString() + Math.random().toString(16).slice(2),
              productId: null,
              productName: "",
              priceListId: (() => {
                const def = getDefaultPriceListId();
                if (def && PRICE_LISTS.some(pl => String(pl.id) === String(def))) return def;
                return PRICE_LISTS.length ? PRICE_LISTS[0].id : null;
              })(),
              price: 0,
              quantity: 1,
              discountPercent: 0,
              vatPercent: 0,
              base: 0,
              discountAmount: 0,
              vatAmount: 0,
              total: 0,
              selected: false,
              missingInPriceList: false
            };
          }

          function recalcLine(line) {
            const price = Number(line.price) || 0;
            const qty = Number(line.quantity) || 0;
            const discountPercent = Number(line.discountPercent) || 0;
            const vatPercent = Number(line.vatPercent) || 0;

            const base = price * qty;
            const discountAmount = base * (discountPercent / 100);
            const baseAfterDiscount = base - discountAmount;
            const vatAmount = baseAfterDiscount * (vatPercent / 100);
            const total = baseAfterDiscount + vatAmount;

            line.base = base;
            line.discountAmount = discountAmount;
            line.vatAmount = vatAmount;
            line.total = total;
          }

          function updateSummary() {
            let sumBase = 0;
            let sumDiscount = 0;
            let sumNoVat = 0;
            let sumVat = 0;
            let sumTotal = 0;

            lines.forEach(l => {
              sumBase += l.base;
              sumDiscount += l.discountAmount;
              const noVat = l.base - l.discountAmount;
              sumNoVat += noVat;
              sumVat += l.vatAmount;
              sumTotal += l.total;
            });

            const elBase = document.getElementById("sum-base");
            const elDiscount = document.getElementById("sum-discount");
            const elNoVat = document.getElementById("sum-no-vat");
            const elVat = document.getElementById("sum-vat");

            if (elBase) elBase.textContent = formatMoney(sumBase);
            if (elDiscount) elDiscount.textContent = formatMoney(sumDiscount);

            if (elVat) elVat.textContent = formatMoney(sumVat);

          function recalcAll() {

          function getAppStateForSave() {
            const cleanLines = lines.map(l => ({
              productId: l.productId,
              productName: l.productName,
              priceListId: l.priceListId,
              price: l.price,
              quantity: l.quantity,
              discountPercent: l.discountPercent,
              vatPercent: l.vatPercent
            }));
            return { lines: cleanLines };
          }

          function applyAppState(state) {
            if (!state || !Array.isArray(state.lines) || !state.lines.length) {
              lines = [createEmptyLine()];
              lines[0].missingInPriceList = false;
              recalcAll();
              renderLines();
              markSaved();
              return;
            }

            lines = state.lines.map(raw => {
              const line = createEmptyLine();
              line.productId = raw.productId || null;
              line.productName = raw.productName || "";
              line.priceListId = raw.priceListId || (PRICE_LISTS.length ? PRICE_LISTS[0].id : null);
              line.price = Number(raw.price) || 0;
              line.quantity = Number(raw.quantity) || 1;
              line.discountPercent = Number(raw.discountPercent) || 0;
              line.vatPercent = Number(raw.vatPercent) || 0;
              line.missingInPriceList = false;
              recalcLine(line);
              return line;
            });

            recalcAll();
            renderLines();
            markSaved();

          // -------------------- BACKEND API --------------------
          async function fetchProducts() {
            const res = await fetch(apiBase + "/api/products/");
            if (!res.ok) throw new Error("Ошибка загрузки товаров");
            const data = (await res.json()) || [];

            const map = new Map();
            for (const p of data) {
              if (!p.id) continue;
              if (!map.has(p.id)) map.set(p.id, p);
            }

            PRODUCTS = Array.from(map.values()).sort((a, b) =>
              (a.name || "").localeCompare(b.name || "", "ru", { sensitivity: "base" })
            );

            logEvent("Products loaded", { count: PRODUCTS.length });
          }

          async function fetchPriceLists() {
            const res = await fetch(apiBase + "/api/prices/");
            if (!res.ok) throw new Error("Ошибка загрузки прайсов");
            const data = (await res.json()) || [];
            PRICE_LISTS = data.map(pl => ({ ...pl, id: String(pl.id) }));
            logEvent("Price lists loaded", { count: PRICE_LISTS.length });
          }

          async function ensurePriceListProductIds(plId) {
            if (!plId) return null;
            const key = String(plId);
            if (PRICE_LIST_PRODUCT_IDS_CACHE.has(key)) return PRICE_LIST_PRODUCT_IDS_CACHE.get(key);

            try {
              const res = await fetch(`${apiBase}/api/prices/${encodeURIComponent(key)}/items?ids_only=1`);
              if (!res.ok) return null;

              const data = await res.json();
              let arr = data;

              if (data && typeof data === "object" && !Array.isArray(data)) {
                arr = data.ids || data.items || [];
              }
              if (!Array.isArray(arr)) arr = [];

              const ids = arr
                .map(x => {
                  if (x == null) return null;
                  if (typeof x === "string" || typeof x === "number") return String(x);
                  if (typeof x === "object") {
                    return x.product_id != null ? String(x.product_id)
                      : x.id != null ? String(x.id)
                        : x.PRODUCT_ID != null ? String(x.PRODUCT_ID)
                          : null;
                  }
                  return null;
                })
                .filter(Boolean);

              const set = new Set(ids);
              PRICE_LIST_PRODUCT_IDS_CACHE.set(key, set);
              return set;
            } catch (e) {
              logEvent("ensurePriceListProductIds failed", { error: String(e), plId }, "WARN");
              return null;
            }
          }

          async function fetchPriceForLine(line) {
            if (!line.productId || !line.priceListId) return;
            const plId = String(line.priceListId);
            const pid = String(line.productId);

            const set = await ensurePriceListProductIds(plId);
            if (set && !set.has(pid)) {
              line.price = 0;
              line.missingInPriceList = true;
              return;
            }

            const url = `${apiBase}/api/prices/${encodeURIComponent(plId)}/price?product_id=${encodeURIComponent(pid)}`;
            const res = await fetch(url);
            if (!res.ok) return;

            const data = await res.json();

            if (data && data.price != null) {
              line.price = Number(data.price) || 0;
              line.missingInPriceList = false;
            } else {
              line.price = 0;
              line.missingInPriceList = true;
            }
          }

          async function autoUpdatePriceAndRecalc(line) {
            await fetchPriceForLine(line);
            recalcLine(line);
            updateSummary();
            renderLines();

          // -------------------- BITRIX WRAPPERS --------------------
          function bxCall(method, params, cb) {
            if (!window.BX24) {
              const e = { message: "BX24 not available" };
              logEvent("BX24 missing", { method, params }, "ERROR");
              cb(e, null);
              return;
            }

            logEvent("BX24 call → " + method, params);

            BX24.callMethod(method, params, function (res) {
              try {
                if (res.error && res.error()) {
                  const err = res.error();
                  logEvent("BX24 error ← " + method, { err, params }, "ERROR");
                  cb(err, null);
                  return;
                }

                const data = (res.data && typeof res.data === "function") ? res.data() : (res.data ? res.data : null);
                logEvent("BX24 ok ← " + method, { hasData: !!data });
                cb(null, data);
              } catch (e) {
                logEvent("BX24 wrapper exception", { e: String(e), method, params }, "ERROR");
                cb({ message: String(e) }, null);
              }
            });
          }

          function entityGet(cb) {
            if (CURRENT_CONTEXT.mode === "QUOTE") {
              bxCall("crm.item.get", { entityTypeId: 7, id: Number(CURRENT_CONTEXT.id) }, function (err, data) {
                if (err) return cb(err, null);
                cb(null, data && data.item ? data.item : data);
              });
              return;
            }
            bxCall("crm.deal.get", { id: CURRENT_CONTEXT.id }, cb);
          }

          function entityUpdate(fields, cb) {
            if (CURRENT_CONTEXT.mode === "QUOTE") {
              bxCall("crm.item.update", {
                entityTypeId: 7,
                id: Number(CURRENT_CONTEXT.id),
                fields: fields
              }, cb);
              return;
            }
            bxCall("crm.deal.update", { id: CURRENT_CONTEXT.id, fields: fields }, cb);
          }

          function getStateFieldName() {
            return (CURRENT_CONTEXT.mode === "QUOTE") ? QUOTE_STATE_FIELD : DEAL_STATE_FIELD;
          }

          function getLocalStorageKey() {
            if (!CURRENT_CONTEXT.mode || !CURRENT_CONTEXT.id) return null;
            const prefix = (CURRENT_CONTEXT.mode === "QUOTE") ? LOCAL_STATE_PREFIX_QUOTE : LOCAL_STATE_PREFIX_DEAL;

          function getQueryParam(name) {
            try {
              const s = window.location.search || "";

          function detectContextFromUrlFirst() {
            const qid = getQueryParam("quote_id");
            if (qid) {
              CURRENT_CONTEXT.mode = "QUOTE";
              CURRENT_CONTEXT.id = String(qid);
              CURRENT_CONTEXT.entityTypeId = 7;
              CURRENT_DEAL_ID = CURRENT_CONTEXT.id;
              logEvent("Context from URL", { mode: CURRENT_CONTEXT.mode, id: CURRENT_CONTEXT.id });
              return true;
            }

            const did = getQueryParam("deal_id");
            if (did) {
              CURRENT_CONTEXT.mode = "DEAL";
              CURRENT_CONTEXT.id = String(did);
              CURRENT_CONTEXT.entityTypeId = 2;
              CURRENT_DEAL_ID = CURRENT_CONTEXT.id;
              logEvent("Context from URL", { mode: CURRENT_CONTEXT.mode, id: CURRENT_CONTEXT.id });
              return true;
            }

            return false;
          }

          function detectContextFromBXPlacement(cb) {
            if (!window.BX24) {
              cb(false);
              return;
            }

            function applyContextFromData(source) {
              if (!source || typeof source !== "object") return false;

              let mode = null;
              let id = null;
              let entityTypeId = null;

              const rawEntityTypeId =
                source.ENTITY_TYPE_ID ||
                source.entityTypeId ||
                source.entity_type_id ||
                source.ownerTypeId ||
                source.OWNER_TYPE_ID;

              const quoteId =
                source.QUOTE_ID ||
                source.quoteId ||
                source.quote_id;

              const dealId =
                source.DEAL_ID ||
                source.dealId ||
                source.deal_id;

              const entityId =
                source.ENTITY_ID ||
                source.entityId ||
                source.entity_id ||
                source.ID ||
                source.Id ||
                source.id;

              if (quoteId) {
                mode = "QUOTE";
                id = String(quoteId).match(/\d+/)?.[0] || String(quoteId);
                entityTypeId = 7;
              } else if (dealId) {
                mode = "DEAL";
                id = String(dealId).match(/\d+/)?.[0] || String(dealId);
                entityTypeId = 2;
              } else if (String(rawEntityTypeId) === "7" && entityId) {
                mode = "QUOTE";
                id = String(entityId).match(/\d+/)?.[0] || String(entityId);
                entityTypeId = 7;
              } else if (String(rawEntityTypeId) === "2" && entityId) {
                mode = "DEAL";
                id = String(entityId).match(/\d+/)?.[0] || String(entityId);
                entityTypeId = 2;
              }

              if (!mode || !id) return false;

              CURRENT_CONTEXT.mode = mode;
              CURRENT_CONTEXT.id = id;
              CURRENT_CONTEXT.entityTypeId = entityTypeId;
              CURRENT_DEAL_ID = id;

              logEvent("Context detected from placement", {
                mode: CURRENT_CONTEXT.mode,
                id: CURRENT_CONTEXT.id,
                entityTypeId: CURRENT_CONTEXT.entityTypeId
              });

              return true;
            }

            try {
              if (BX24.placement && BX24.placement.info) {
                const info = BX24.placement.info();
                if (info && info.options) {
                  let opts = info.options;
                  try {
                    if (typeof opts === "string") opts = JSON.parse(opts);
                  } catch (e) {
                    opts = {};
                  }

                  if (applyContextFromData(opts)) {
                    cb(true);
                    return;
                  }
                }
              }
            } catch (e) { }

            BX24.callMethod("placement.getData", {}, function (res) {
              try {
                if (res.error && res.error()) {
                  logEvent("placement.getData error", { err: res.error() }, "WARN");
                  cb(false);
                  return;
                }

                const raw = (res.data && typeof res.data === "function") ? res.data() : (res.data ? res.data : {});

                if (applyContextFromData(raw)) {
                  cb(true);
                  return;
                }

                if (raw && raw.PLACEMENT_OPTIONS) {
                  let opts2 = raw.PLACEMENT_OPTIONS;
                  try {
                    if (typeof opts2 === "string") opts2 = JSON.parse(opts2);
                  } catch (e) {
                    opts2 = {};
                  }

                  if (applyContextFromData(opts2)) {
                    cb(true);
                    return;
                  }
                }

                cb(false);
              } catch (e) {
                cb(false);
              }
            });
          }

          function initBitrixContextUnified() {
            if (detectContextFromUrlFirst()) {
              setTagText();

          async function loadEntityStateFromBackend() {
            if (!CURRENT_CONTEXT.id || !CURRENT_CONTEXT.mode) return null;

            const url =
              `${apiBase}/api/bx/load?mode=${encodeURIComponent(CURRENT_CONTEXT.mode)}&id=${encodeURIComponent(CURRENT_CONTEXT.id)}`;

            const resp = await fetch(url, {
              method: "GET",
              headers: { "Accept": "application/json" }
            });

            const data = await resp.json().catch(() => ({}));

            if (!resp.ok || data.ok === false) {
              throw new Error(data.error || ("HTTP " + resp.status));
            }

            const rawState = data.rawState || "";
            const state = data.state || {};

            logEvent("State loaded from backend", {
              mode: CURRENT_CONTEXT.mode,
              id: CURRENT_CONTEXT.id,
              hasRawState: !!rawState,
              stateLines: Array.isArray(state.lines) ? state.lines.length : 0
            });

            return {
              rawState: rawState || JSON.stringify(state || {}),
              state: state || {}
            };
          }
          // -------------------- LOAD / SAVE STATE --------------------
          function loadEntityState() {
            if (!CURRENT_CONTEXT.id || !CURRENT_CONTEXT.mode) return;

            const requestSeq = ++ENTITY_LOAD_SEQ;
            const requestEditVersion = LOCAL_EDIT_VERSION;

            loadEntityStateFromBackend()
              .then((payload) => {
                if (!payload) return;
                if (requestSeq !== ENTITY_LOAD_SEQ) return;

                if (LOCAL_EDIT_VERSION !== requestEditVersion || hasUnsavedChanges) {
                  logEvent("Remote state skipped because local state changed", {
                    mode: CURRENT_CONTEXT.mode,
                    id: CURRENT_CONTEXT.id,
                    requestSeq,
                    requestEditVersion,
                    currentEditVersion: LOCAL_EDIT_VERSION
                  }, "WARN");
                  return;
                }

                LAST_REMOTE_STATE_RAW = payload.rawState;
                REMOTE_STATE_LOADED = true;
                applyAppState(payload.state);
                markSaved();
              })
              .catch((backendErr) => {
                logEvent("Backend load failed", {
                  error: String(backendErr),
                  mode: CURRENT_CONTEXT.mode,
                  id: CURRENT_CONTEXT.id
                }, "ERROR");

                if (window.BX24) {
                  entityGet(function (err, entity) {
                    if (requestSeq !== ENTITY_LOAD_SEQ) return;

                    if (LOCAL_EDIT_VERSION !== requestEditVersion || hasUnsavedChanges) {
                      logEvent("BX24 fallback skipped because local state changed", {
                        mode: CURRENT_CONTEXT.mode,
                        id: CURRENT_CONTEXT.id,
                        requestSeq,
                        requestEditVersion,
                        currentEditVersion: LOCAL_EDIT_VERSION
                      }, "WARN");
                      return;
                    }

                    if (err) {
                      logEvent("entityGet fallback error", { err }, "ERROR");
                      loadStateFromLocalStorageFallback(requestEditVersion, requestSeq);
                      return;
                    }

                    const dataObj = entity || {};
                    const fieldName = getStateFieldName();
                    const rawState = dataObj ? dataObj[fieldName] : null;

                    logEvent("Entity loaded via BX24 fallback", {
                      mode: CURRENT_CONTEXT.mode,
                      id: CURRENT_CONTEXT.id,
                      fieldName,
                      hasState: !!rawState
                    });

                    if (!rawState) {
                      loadStateFromLocalStorageFallback(requestEditVersion, requestSeq);
                      return;
                    }

                    if (LAST_REMOTE_STATE_RAW === rawState && REMOTE_STATE_LOADED) return;

                    try {
                      const st = JSON.parse(rawState);

                      if (requestSeq !== ENTITY_LOAD_SEQ) return;
                      if (LOCAL_EDIT_VERSION !== requestEditVersion || hasUnsavedChanges) {
                        logEvent("Parsed BX24 state skipped because local state changed", {
                          mode: CURRENT_CONTEXT.mode,
                          id: CURRENT_CONTEXT.id,
                          requestSeq,
                          requestEditVersion,
                          currentEditVersion: LOCAL_EDIT_VERSION
                        }, "WARN");
                        return;
                      }

                      LAST_REMOTE_STATE_RAW = rawState;
                      REMOTE_STATE_LOADED = true;
                      applyAppState(st);
                      markSaved();
                    } catch (e) {
                      logEvent("CRM state parse error in BX24 fallback", {
                        error: String(e),
                        rawStateSample: String(rawState).slice(0, 200)
                      }, "ERROR");
                      loadStateFromLocalStorageFallback(requestEditVersion, requestSeq);
                    }
                  });
                  return;
                }

                loadStateFromLocalStorageFallback(requestEditVersion, requestSeq);
              });
          }

          function loadStateFromLocalStorageFallback(expectedEditVersion = null, expectedRequestSeq = null) {
            if (expectedRequestSeq != null && expectedRequestSeq !== ENTITY_LOAD_SEQ) return;

            if (expectedEditVersion != null && (LOCAL_EDIT_VERSION !== expectedEditVersion || hasUnsavedChanges)) {
              logEvent("Local fallback skipped because local state changed", {
                mode: CURRENT_CONTEXT.mode,
                id: CURRENT_CONTEXT.id,
                expectedEditVersion,
                currentEditVersion: LOCAL_EDIT_VERSION
              }, "WARN");
              return;
            }

            try {
              const k = getLocalStorageKey();
              if (k && window.localStorage) {
                const localRaw = window.localStorage.getItem(k);
                if (localRaw) {
                  const localState = JSON.parse(localRaw);

                  logEvent("State loaded from localStorage fallback", {
                    key: k,
                    mode: CURRENT_CONTEXT.mode,
                    id: CURRENT_CONTEXT.id
                  }, "WARN");

                  applyAppState(localState);
                  return;
                }
              }
            } catch (e) { }

            logEvent("No remote state and no local fallback state", {
              mode: CURRENT_CONTEXT.mode,
              id: CURRENT_CONTEXT.id
            }, "WARN");

            applyAppState({ lines: [] });
          }

          async function saveCurrentEntityState() {
            recalcAll();

            const sumTotal = lines.reduce((acc, l) => acc + (Number(l.total) || 0), 0);
            const state = getAppStateForSave();

            try {
              const k = getLocalStorageKey();
              if (k && window.localStorage) window.localStorage.setItem(k, JSON.stringify(state));
            } catch (e) { }

            if (!CURRENT_CONTEXT.mode || !CURRENT_CONTEXT.id) {
              let manual = window.prompt("Не удалось определить контекст.\nВведите: DEAL:123 или QUOTE:61");
              if (!manual) {
                showToast("Без ID сохранить в CRM нельзя.", "error");
                return;
              }
              manual = String(manual).trim().toUpperCase();
              const m = manual.match(/^(DEAL|QUOTE)\s*:\s*(\d+)$/);
              if (!m) {
                showToast("Неверный формат. Пример: DEAL:123 или QUOTE:61", "error");
                return;
              }
              CURRENT_CONTEXT.mode = m[1];
              CURRENT_CONTEXT.id = m[2];
              CURRENT_DEAL_ID = CURRENT_CONTEXT.id;
              setTagText();
            }

            // 1) backend save
            try {
              const resp = await fetch("/api/bx/save", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  mode: CURRENT_CONTEXT.mode,
                  id: String(CURRENT_CONTEXT.id),
                  sumTotal,
                  state,
                }),
              });

              const data = await resp.json().catch(() => ({}));

              if (!resp.ok || data.ok === false) {
                throw new Error(data.error || ("HTTP " + resp.status));
              }

              showToast(
                (CURRENT_CONTEXT.mode === "QUOTE" ? "Сохранено в предложении #" : "Сохранено в сделке #") + CURRENT_CONTEXT.id,
                "success"
              );

              markSaved();
              LAST_REMOTE_STATE_RAW = JSON.stringify(state);
              REMOTE_STATE_LOADED = true;
              loadEntityState();
              return;
            } catch (e) {
              console.error("Backend save failed:", e);
            }

            // 2) BX24 fallback
            if (!window.BX24) {
              showToast("Нет Bitrix24 SDK. Backend-сохранение тоже не сработало — см. консоль.", "error", true);
              return;
            }

            const fields = {};
            fields[getStateFieldName()] = JSON.stringify(state);

            if (CURRENT_CONTEXT.mode === "QUOTE") fields[QUOTE_OPPORTUNITY_FIELD] = sumTotal;
            else fields[DEAL_OPPORTUNITY_FIELD] = sumTotal;

            entityUpdate(fields, function (err) {
              if (err) {
                const msg = errToText(err);
                showToast("Ошибка сохранения: " + msg, "error");
                return;
              }
              showToast("Сохранено (BX24) #" + CURRENT_CONTEXT.id, "success");
              markSaved();
              loadEntityState();
            });
          }

          function collectTotalsForDocs() {
            let base = 0;
            let discount = 0;
            let noVat = 0;
            let vat = 0;
            let total = 0;

            lines.forEach(l => {
              const price = Number(l.price) || 0;
              const qty = Number(l.quantity) || 0;
              const discountPercent = Number(l.discountPercent) || 0;
              const vatPercent = Number(l.vatPercent) || 0;

              const lineBase = price * qty;
              const lineDiscount = lineBase * (discountPercent / 100);
              const baseAfterDiscount = lineBase - lineDiscount;
              const lineVat = baseAfterDiscount * (vatPercent / 100);
              const lineTotal = baseAfterDiscount + lineVat;

              base += lineBase;
              discount += lineDiscount;
              noVat += baseAfterDiscount;
              vat += lineVat;
              total += lineTotal;
            });

            return { base, discount, no_vat: noVat, vat, total };
          }

            if (!variantInput) {
              showToast("Выберите вариант документа", "error");
              return;
            }

            const formatInput = document.querySelector('input[name="doc-format"]:checked');
            const format = formatInput ? formatInput.value : "pdf";
            const variant = variantInput.value;

            const state = getAppStateForSave();
            const totals = collectTotalsForDocs();

            try {
              const entityIdForDoc = String(CURRENT_CONTEXT.id || CURRENT_DEAL_ID || "");

              const res = await fetch(apiBase + "/api/docs/generate", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                  variant,
                  format,
                  mode: CURRENT_CONTEXT.mode,
                  entity_id: entityIdForDoc,
                  lines: state.lines,
                  totals
                })
              });

              if (!res.ok) {
                showToast("Ошибка генерации документа", "error");
                return;
              }

              const blob = await res.blob();
              const url = window.URL.createObjectURL(blob);

              const a = document.createElement("a");
              a.href = url;
              a.download = (format === "docx")
                ? "komercheskoe_predlozhenie.docx"
                : "komercheskoe_predlozhenie.pdf";

              document.body.appendChild(a);
              a.click();
              a.remove();

              setTimeout(() => window.URL.revokeObjectURL(url), 1500);

              showToast("Документ сформирован", "success");
            } catch (e) {
              console.error(e);
              showToast("Ошибка сети при генерации документа", "error");
            }

          // -------------------- DROPDOWN HELPERS --------------------
          function isDropdownOpen() {
            return productDropdownEl && productDropdownEl.classList.contains("visible");
          }

          function getScrollParents(el) {
            const parents = [];
            if (!el) return parents;

            let p = el.parentElement;
            const re = /(auto|scroll|overlay)/i;

            while (p && p !== document.body) {
              const st = getComputedStyle(p);
              const overflowY = st.overflowY || st.overflow;
              const overflowX = st.overflowX || st.overflow;

              if (re.test(overflowY) || re.test(overflowX)) parents.push(p);
              p = p.parentElement;
            }

            parents.push(window);
            return parents;
          }

          function detachDropdownTracking() {
            dropdownScrollParents.forEach(sp => {
              try { sp.removeEventListener("scroll", scheduleDropdownReposition); } catch (_) { }
            });
            window.removeEventListener("resize", scheduleDropdownReposition);
            dropdownScrollParents = [];
            dropdownAnchorEl = null;
          }

          function attachDropdownTracking(anchorEl) {
            detachDropdownTracking();
            dropdownAnchorEl = anchorEl;
            dropdownScrollParents = getScrollParents(anchorEl);

            dropdownScrollParents.forEach(sp => {
              try { sp.addEventListener("scroll", scheduleDropdownReposition, { passive: true }); } catch (_) { }
            });

            window.addEventListener("resize", scheduleDropdownReposition, { passive: true });
          }

          function scheduleDropdownReposition() {
            if (!isDropdownOpen()) return;
            if (dropdownRaf) return;
            dropdownRaf = requestAnimationFrame(() => {
              dropdownRaf = 0;
              repositionProductDropdown();
            });
          }

          function repositionProductDropdown() {
            if (!isDropdownOpen()) return;
            if (!dropdownAnchorEl || !document.body.contains(dropdownAnchorEl)) {
              closeProductDropdown();
              return;
            }

            const rect = dropdownAnchorEl.getBoundingClientRect();

            let left = rect.left;
            let top = rect.bottom;

            const extraWidth = 40;
            const desiredWidth = rect.width + extraWidth;
            productDropdownEl.style.width = desiredWidth + "px";

            const ddRect = productDropdownEl.getBoundingClientRect();
            const ddHeight = ddRect.height || 260;

            const margin = 8;
            const spaceBelow = window.innerHeight - rect.bottom - margin;
            const spaceAbove = rect.top - margin;

            const openUp = (spaceBelow < ddHeight) && (spaceAbove > spaceBelow);
            if (openUp) {
              top = Math.max(margin, rect.top - ddHeight);
            }

            const maxLeft = window.innerWidth - desiredWidth - margin;
            left = Math.min(Math.max(margin, left), Math.max(margin, maxLeft));

            const maxH = openUp ? (rect.top - margin) : (window.innerHeight - rect.bottom - margin);
            productDropdownEl.style.maxHeight = Math.max(160, maxH) + "px";

            productDropdownEl.style.left = Math.round(left) + "px";
            productDropdownEl.style.top = Math.round(top) + "px";
          }

          // -------------------- PRICE MANAGER (RESTORED OLD LOGIC) --------------------
          // State

          let pmItemsDirty = false;

          // Modal state + persistence (old behavior)
          const PM_RECT_KEY = "prices_widget_pm_rect_v2";
          const PM_FS_KEY = "prices_widget_pm_fullscreen_v2";
          const PM_ITEMS_FS_KEY = "prices_widget_pm_items_fullscreen_v2";

          let pmDragResizeInited = false;
          let pmIsDragging = false;
          let pmIsResizing = false;
          let pmIsFullscreen = false;
          let pmPrevRect = null;
          let pmItemsIsFullscreen = false;

          function getPmEls() {
            const backdrop = document.getElementById("price-manager-backdrop");
            const dialog = backdrop ? backdrop.querySelector(".modal-dialog") : null;
            const header = dialog ? dialog.querySelector(".modal-header") : null;
            return { backdrop, dialog, header };
          }

          function readRectFromDialog(dialog) {
            const r = dialog.getBoundingClientRect();
            return { left: r.left, top: r.top, width: r.width, height: r.height };
          }

          function applyRectToDialog(dialog, rect) {
            if (!dialog || !rect) return;
            dialog.style.position = "absolute";
            dialog.style.left = Math.round(rect.left) + "px";
            dialog.style.top = Math.round(rect.top) + "px";
            dialog.style.width = Math.round(rect.width) + "px";
            dialog.style.height = Math.round(rect.height) + "px";
          }

          function clampRect(rect) {
            const margin = 12;
            const minW = 620;
            const minH = 260;

            const vw = window.innerWidth;
            const vh = window.innerHeight;

            const width = Math.min(Math.max(rect.width, minW), vw - margin * 2);
            const height = Math.min(Math.max(rect.height, minH), vh - margin * 2);

            let left = rect.left;
            let top = rect.top;

            left = Math.min(Math.max(left, margin), vw - width - margin);
            top = Math.min(Math.max(top, margin), vh - height - margin);

            return { left, top, width, height };
          }

          function savePmRect(rect) {
            try { localStorage.setItem(PM_RECT_KEY, JSON.stringify(rect)); } catch (e) { }
          }

          function loadPmRect() {
            try {
              const raw = localStorage.getItem(PM_RECT_KEY);
              if (!raw) return null;
              const r = JSON.parse(raw);
              if (!r || typeof r !== "object") return null;
              if (![r.left, r.top, r.width, r.height].every(n => Number.isFinite(Number(n)))) return null;
              return clampRect({ left: +r.left, top: +r.top, width: +r.width, height: +r.height });
            } catch (e) { return null; }
          }

          function savePmFullscreenFlag(v) {
            try { localStorage.setItem(PM_FS_KEY, v ? "1" : "0"); } catch (e) { }
          }
          function loadPmFullscreenFlag() {
            try { return localStorage.getItem(PM_FS_KEY) === "1"; } catch (e) { return false; }
          }

          function savePmItemsFullscreenFlag(v) {
            try { localStorage.setItem(PM_ITEMS_FS_KEY, v ? "1" : "0"); } catch (e) { }
          }
          function loadPmItemsFullscreenFlag() {
            try { return localStorage.getItem(PM_ITEMS_FS_KEY) === "1"; } catch (e) { return false; }
          }

          function setPriceManagerFullscreen(on) {
            const { dialog } = getPmEls();
            if (!dialog) return;

            if (on) {
              if (!pmIsFullscreen) {
                pmPrevRect = readRectFromDialog(dialog);
                savePmRect(clampRect(pmPrevRect));
              }
              pmIsFullscreen = true;
              savePmFullscreenFlag(true);

              const margin = 12;
              dialog.style.position = "absolute";
              dialog.style.left = margin + "px";
              dialog.style.top = margin + "px";
              dialog.style.width = Math.max(620, window.innerWidth - margin * 2) + "px";
              dialog.style.height = Math.max(260, window.innerHeight - margin * 2) + "px";
            } else {
              pmIsFullscreen = false;
              savePmFullscreenFlag(false);

              const rect = loadPmRect() || pmPrevRect;
              if (rect) applyRectToDialog(dialog, clampRect(rect));
              else {
                const margin = 12;
                const w = Math.min(900, window.innerWidth - margin * 2);
                const h = Math.min(580, window.innerHeight - margin * 2);
                applyRectToDialog(dialog, clampRect({
                  left: (window.innerWidth - w) / 2,
                  top: (window.innerHeight - h) / 2,
                  width: w,
                  height: h
                }));
              }
            }

            // after any size change, reposition dropdown if open
            scheduleDropdownReposition();
          }

          function setPmItemsFullscreen(on) {
            const { dialog } = getPmEls();
            if (!dialog) return;

            pmItemsIsFullscreen = !!on;
            savePmItemsFullscreenFlag(pmItemsIsFullscreen);

            dialog.classList.toggle("pm-items-fullscreen", pmItemsIsFullscreen);

            // after layout change
            scheduleDropdownReposition();
          }

          function openPriceManager() {

            if (!backdrop || !dialog) {

              return;

            backdrop.classList.add("visible");
            backdrop.style.display = "flex";

            // Restore previous state (old behavior)
            const savedRect = loadPmRect();
            const wantFs = loadPmFullscreenFlag();

            if (savedRect) applyRectToDialog(dialog, savedRect);
            else {
              const margin = 12;
              const w = Math.min(900, window.innerWidth - margin * 2);
              const h = Math.min(580, window.innerHeight - margin * 2);
              applyRectToDialog(dialog, clampRect({
                left: (window.innerWidth - w) / 2,
                top: (window.innerHeight - h) / 2,
                width: w,
                height: h
              }));
            }

            if (!pmDragResizeInited) {
              enablePriceManagerDragging();
              enablePriceManagerResizing();
              pmDragResizeInited = true;
            }

            // Restore items fullscreen state
            setPmItemsFullscreen(loadPmItemsFullscreenFlag());

            // Apply fullscreen (after rect init so we have prevRect)
            setPriceManagerFullscreen(!!wantFs);

            // Reset searches
            pmSearchTerm = "";
            const searchInput = document.getElementById("pm-search-input");
            if (searchInput) searchInput.value = "";

            const { backdrop, dialog } = getPmEls();

          }

          function enablePriceManagerDragging() {
            const { dialog, header } = getPmEls();
            if (!dialog || !header) return;

            header.addEventListener("mousedown", (e) => {
              // don't start drag when clicking buttons in header
              const t = e.target;
              if (t && (t.closest("#pm-btn-close") || t.closest("#pm-btn-maximize"))) return;

              if (pmIsFullscreen || pmIsResizing) return;

              pmIsDragging = true;
              e.preventDefault();

              const startX = e.clientX;
              const startY = e.clientY;
              const startRect = readRectFromDialog(dialog);

              function onMove(ev) {
                if (!pmIsDragging) return;
                const dx = ev.clientX - startX;
                const dy = ev.clientY - startY;

                const next = clampRect({
                  left: startRect.left + dx,
                  top: startRect.top + dy,
                  width: startRect.width,
                  height: startRect.height
                });
                applyRectToDialog(dialog, next);
              }

              function onUp() {
                if (!pmIsDragging) return;
                pmIsDragging = false;
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);

                // persist rect
                const rect = clampRect(readRectFromDialog(dialog));
                savePmRect(rect);
              }

              document.addEventListener("mousemove", onMove);
              document.addEventListener("mouseup", onUp);
            });
          }

          function enablePriceManagerResizing() {
            const { dialog } = getPmEls();
            if (!dialog) return;

            const handles = Array.from(dialog.querySelectorAll(".modal-resize-handle"));
            if (!handles.length) return;

            const minW = 620;
            const minH = 260;

            function startResize(e, kind) {
              if (pmIsFullscreen || pmIsDragging) return;
              pmIsResizing = true;
              e.preventDefault();
              e.stopPropagation();

              const startX = e.clientX;
              const startY = e.clientY;
              const start = readRectFromDialog(dialog);

              function onMove(ev) {
                if (!pmIsResizing) return;
                const dx = ev.clientX - startX;
                const dy = ev.clientY - startY;

                let left = start.left;
                let top = start.top;
                let width = start.width;
                let height = start.height;

                const right = start.left + start.width;
                const bottom = start.top + start.height;

                if (kind.includes("right")) width = Math.max(minW, start.width + dx);
                if (kind.includes("bottom")) height = Math.max(minH, start.height + dy);

                if (kind.includes("left")) {
                  const newLeft = start.left + dx;
                  width = Math.max(minW, right - newLeft);
                  left = right - width;
                }

                if (kind.includes("top")) {
                  const newTop = start.top + dy;
                  height = Math.max(minH, bottom - newTop);
                  top = bottom - height;
                }

                const next = clampRect({ left, top, width, height });
                applyRectToDialog(dialog, next);
              }

              function onUp() {
                if (!pmIsResizing) return;
                pmIsResizing = false;
                document.removeEventListener("mousemove", onMove);
                document.removeEventListener("mouseup", onUp);

                const rect = clampRect(readRectFromDialog(dialog));
                savePmRect(rect);
              }

              document.addEventListener("mousemove", onMove);
              document.addEventListener("mouseup", onUp);
            }

            const map = [
              ["resize-right", "right"],
              ["resize-left", "left"],
              ["resize-top", "top"],
              ["resize-bottom", "bottom"],
              ["resize-corner-rt", "right top"],
              ["resize-corner-rb", "right bottom"],
              ["resize-corner-lt", "left top"],
              ["resize-corner-lb", "left bottom"],
            ];

            for (const [cls, kind] of map) {
              const h = dialog.querySelector("." + cls);
              if (!h) continue;
              h.addEventListener("mousedown", (e) => startResize(e, kind));
            }
          }

          // ---------- Price manager backend calls (best-effort, keeps compatibility) ----------
          function normalizeItemsResponse(data) {
            if (!data) return [];
            if (Array.isArray(data)) return data;
            if (data.items && Array.isArray(data.items)) return data.items;
            if (data.result && Array.isArray(data.result)) return data.result;
            return [];

              inp.addEventListener("blur", () => {
                let raw = (inp.value || "").replace(/\s+/g, "").replace(",", ".");
                let num = Number(raw);
                if (isNaN(num)) num = 0;
                it.price = num;
                inp.value = formatMoney(it.price);
                pmItemsDirty = true;
              });

              tdPrice.appendChild(inp);
              tr.appendChild(tdPrice);

              // product name (✅ только название, без описания)
              const tdName = document.createElement("td");
              tdName.textContent = it.product_name || "(без названия)";

              // delete button (✅ красный крестик справа)

              btnDel.title = "Удалить товар из прайса";
              btnDel.textContent = "✖";
              btnDel.style.border = "none";
              btnDel.style.background = "transparent";
              btnDel.style.cursor = "pointer";
              btnDel.style.fontSize = "22px";
              btnDel.style.lineHeight = "1";
              btnDel.style.color = "#e53935"; // красный
              btnDel.style.padding = "0 6px";

              btnDel.addEventListener("click", () => {
                // удаляем из pmItems
                pmItems = pmItems.filter(x => String(x.product_id) !== String(it.product_id));
                pmItemsDirty = true;

                // сбросим кеш ids-only, чтобы подсветка "нет в прайсе" сразу стала корректной
                try { PRICE_LIST_PRODUCT_IDS_CACHE.delete(String(pmSelectedId)); } catch (_) { }

                renderPriceItemsTable();
                updatePmMeta();
              });

              tdDel.appendChild(btnDel);
              tr.appendChild(tdDel);

              tbody.appendChild(tr);
            });
